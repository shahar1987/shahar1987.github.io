<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://www.gstatic.com; manifest-src 'self'; worker-src 'self'; frame-src https://ttcmh-2a752.firebaseapp.com https://www.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>תן לי שולחן — מועדון טניס שולחן מבואות החרמון</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1B2A41">
<link rel="icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תן לי שולחן">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ============ tokens ============ */
:root{
  /* אותה פלטה כמו אפליקציית הנוכחות (tailwind.config.js במאגר ttc-mvh-attendance) */
  --navy:#1B2A41;                                  /* כותרת עליונה */
  --act:#3B5A7F; --act-2:#2F4A6E; --act-soft:#EAF0F5; /* פעולה ראשית */
  --felt:#2F4A6E; --felt-2:#3B5A7F; --felt-3:#1B2A41; /* שולחנות */
  --chalk:#FFFFFF; --ball:#9A6B18; --ball-2:#7E5710; --ball-soft:#F7EFDD; /* ענבר: "שים לב", מקום ראשון */
  --rubber:#B24B41; --pip:#1B242B;
  --ink:#1B242B; --ink-2:#3F4C55; --ink-3:#606E77;
  --paper:#F4F6F5; --card:#FFFFFF; --edge:#D9DFDE; --rule:#EDF0EF;
  --ok:#2E7D6B; --warn:#9A6B18; --bad:#B24B41;
  --r-soft:16px; --r-hard:6px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(27,36,43,.05);
  --shadow-2:0 10px 28px -12px rgba(27,36,43,.25);
  --tap:48px;
  --gut:clamp(12px,3vw,26px);
  --ease:cubic-bezier(.22,.68,.28,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:clamp(15px,.35vw + 14px,17px);line-height:1.5;
  font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0;line-height:1.12;font-weight:600;letter-spacing:-.01em}
h1{font-family:"Assistant",system-ui,sans-serif;font-weight:800;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.01em}
h2{font-size:clamp(18px,1.6vw,22px)}
h3{font-size:clamp(16px,1.2vw,18px)}
.num{font-family:"Assistant",system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}

/* ============ controls ============ */
button{
  font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--edge);
  border-radius:var(--r-soft);padding:11px 18px;min-height:var(--tap);
  background:var(--card);color:var(--ink);
  transition:background .16s var(--ease),border-color .16s var(--ease),transform .1s var(--ease),box-shadow .16s var(--ease);
}
button:hover{border-color:#B7C1BF;background:#FAFBFB}
button:active{transform:scale(.975)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--act);outline-offset:2px;border-radius:8px}
button.primary,button.green{background:var(--act);color:#fff;border-color:var(--act);font-weight:700;box-shadow:0 6px 16px -8px rgba(27,42,65,.55)}
button.primary:hover,button.green:hover{background:var(--act-2);border-color:var(--act-2)}
button.primary:active,button.green:active{box-shadow:none;transform:scale(.985)}
button.outline{background:#fff;color:var(--act);border-color:#A9BDD4;font-weight:700}
button.outline:hover{background:var(--act-soft);border-color:var(--act)}
button.ghost{background:transparent;border-color:transparent;color:var(--ink-2);box-shadow:none}
button.ghost:hover{background:rgba(27,36,43,.05);border-color:transparent}
button.danger{color:var(--bad);border-color:#E5B8B3}
button.danger:hover{background:#F8EAE8;border-color:#D99B94}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
button.big{padding:15px 24px;font-size:clamp(17px,1.1vw,19px);min-height:56px}
input,select,textarea{
  font:inherit;padding:11px 13px;min-height:var(--tap);
  border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--ink);width:100%;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
}
input:hover,select:hover{border-color:#B7C1BF}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
label{display:block;font-weight:500;margin:16px 0 6px;font-size:.94em}
.hint{color:var(--ink-3);font-size:.86em;margin-top:6px;line-height:1.45}
.muted{color:var(--ink-2)}
.tiny{font-size:.8em;color:var(--ink-3)}

/* ============ shell ============ */
header{
  background:var(--navy);color:var(--chalk);
  padding:calc(12px + env(safe-area-inset-top)) var(--gut) 12px;
  position:sticky;top:0;z-index:30;
}
header.has-steps{padding-bottom:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand .logo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .logo i{width:14px;height:14px;border-radius:50%;background:#D4B977;flex:none;box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.brand .logotext{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand .appname{font-weight:800;font-size:clamp(19px,1.8vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .club{font-weight:400;opacity:.72;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .acts{display:flex;align-items:center;gap:4px;flex:none}
header button.ghost{color:var(--chalk);padding:8px 12px;min-height:44px}
header button.ghost:hover{background:rgba(255,255,255,.12)}
#syncDot{width:10px;height:10px;border-radius:50%;background:#B7C1BF;display:inline-block;flex:none;transition:background .3s var(--ease)}
button.sync{display:inline-flex;align-items:center;gap:7px;font-size:.82em;padding:7px 12px;min-height:36px;opacity:.85}
button.sync.bad{background:rgba(178,75,65,.35);opacity:1}
button.sync.bad #syncDot{animation:idleBlink 1.6s infinite}
.steps{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.steps::-webkit-scrollbar{display:none}
.steps:empty{display:none}
.step{
  flex:1 0 auto;min-width:78px;padding:9px 12px 11px;text-align:center;
  font-size:.92em;font-weight:500;border:0;border-radius:0;background:none;
  color:rgba(255,255,255,.66);white-space:nowrap;min-height:0;
  border-bottom:3px solid transparent;margin-bottom:-3px;transition:color .2s var(--ease),border-color .2s var(--ease);
}
.step:hover:not(:disabled){color:rgba(255,255,255,.9);background:none;border-color:rgba(255,255,255,.3)}
.step.done{color:rgba(255,255,255,.85)}
.step.active{color:#fff;font-weight:700;border-bottom-color:#D4B977}
.step:disabled{opacity:.35;cursor:default}
main{max-width:1320px;margin:0 auto;padding:calc(var(--gut) + 4px) var(--gut) calc(96px + env(safe-area-inset-bottom))}

/* ============ surfaces ============ */
.card{background:var(--card);border:1px solid var(--edge);border-radius:var(--r-soft);padding:clamp(15px,2vw,22px);box-shadow:var(--shadow-1)}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.toolbar.static{position:static;background:none;padding-top:0}
.toolbar{
  position:sticky;bottom:0;z-index:20;
  background:linear-gradient(to top,var(--paper) 62%,rgba(244,246,245,0));
  padding:16px 0 calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;
}
.radio-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:10px 16px;min-height:var(--tap);
  border:1px solid var(--edge);border-radius:var(--r-pill);background:#fff;cursor:pointer;user-select:none;
  transition:background .16s var(--ease),color .16s var(--ease),border-color .16s var(--ease),transform .1s var(--ease);
}
.chip:hover{border-color:#B7C1BF}
.chip:active{transform:scale(.97)}
.chip input{width:auto;margin:0;min-height:0;accent-color:var(--act)}
.chip.on{background:var(--act);color:#fff;border-color:var(--act)}
.chip.on input{accent-color:#fff}
.pill{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:.78em;font-weight:500;background:var(--rule);color:var(--ink-2)}
.pill.seed1{background:var(--ball-soft);color:var(--ball-2)}
.pill.seed2{background:#D9E3EC;color:var(--act-2)}
.pill.seed3{background:#E7F1ED;color:#1F5A4C}
.warn-box{background:#F7EFDD;border:1px solid #E3CF9E;border-left:4px solid var(--warn);border-radius:12px;padding:12px 14px;font-size:.9em}
.err-box{background:#F8EAE8;border:1px solid #E5B8B3;border-left:4px solid var(--bad);border-radius:12px;padding:12px 14px;font-size:.9em}
.explain{background:var(--act-soft);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;font-size:.9em}
.explain li{margin:4px 0}
.sep{display:inline-block;width:1px;height:.85em;background:var(--edge);margin:0 8px;vertical-align:-1px}

/* ============ players ============ */
.plist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.plist li{
  display:flex;align-items:center;gap:11px;padding:10px 13px;background:#fff;
  border:1px solid var(--edge);border-radius:12px;
  animation:rowIn .26s var(--ease) both;
}
.plist li .n{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.plist li .club{color:var(--ink-3);font-size:.82em}
.plist li button{padding:6px 10px;min-height:36px}
@keyframes rowIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* ============ groups ============ */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.group{background:#fff;border:1px solid var(--edge);border-radius:var(--r-soft);overflow:hidden;box-shadow:var(--shadow-1)}
.group header.gh{
  background:none;padding:13px 15px;color:var(--ink);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-bottom:1px solid var(--rule);box-shadow:inset 0 3px 0 var(--gc,var(--felt));
  position:sticky;top:0;
}
.group header.gh h3{display:flex;align-items:center;gap:9px}
.gdot{width:11px;height:11px;border-radius:50%;background:var(--gc,var(--felt));display:inline-block;flex:none}
.group ul{list-style:none;margin:0;padding:8px;min-height:64px}
.group li{
  padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  cursor:grab;border:1px dashed transparent;transition:background .15s var(--ease),border-color .15s var(--ease);
}
.group li:hover{background:var(--paper)}
.group li.selected{border-color:var(--ball);background:var(--ball-soft)}
.group.drop{outline:3px dashed var(--ball);outline-offset:-4px;background:#FBF7EE}

/* ============ live layout ============ */
.live-top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.stat{display:flex;gap:clamp(14px,2.5vw,28px);flex-wrap:wrap}
.stat b{font-family:"Assistant",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(20px,2.4vw,27px);display:block;line-height:1.05}
.stat span{font-size:.76em;color:var(--ink-3)}
/* לוח בקרה: התראות קודם, אחר כך מספרים, התקדמות ושולחנות */
.dash-alerts{display:grid;gap:8px;margin-bottom:14px}
.dash-alert{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;border:1px solid #E3CF9E;border-right:5px solid var(--warn);background:#F7EFDD;color:#3a2b0b;font-weight:600}
.dash-alert.ok{border-color:#B9D8C2;border-right-color:#2E7D4F;background:#E9F4EC;color:#163d26}
.dash-alert.go{border-color:#B7C7DC;border-right-color:var(--act);background:#E8EEF6;color:#14263d}
.dash-alert button{min-height:44px}
.dash-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.dash-kpi{background:var(--card);border:1px solid var(--edge);border-radius:var(--r-soft);padding:12px 14px;box-shadow:var(--shadow-1)}
.dash-kpi b{display:block;font-weight:800;font-size:clamp(22px,2.6vw,30px);font-variant-numeric:tabular-nums;line-height:1.1}
.dash-kpi span{font-size:.85em;color:var(--ink-3)}
.dash-prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:0 0 16px}
.dash-g{all:unset;box-sizing:border-box;cursor:pointer;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--edge);border-right:5px solid var(--gc);display:flex;flex-direction:column;gap:4px}
.dash-g:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.dash-g b{font-size:.95em}.dash-g .bar{height:6px;border-radius:3px;background:var(--edge);overflow:hidden}.dash-g .bar i{display:block;height:100%;background:var(--gc)}
.dash-g.done{opacity:.6}
.progress{height:8px;background:var(--edge);border-radius:var(--r-pill);overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--felt-2),var(--felt));transition:width .6s var(--ease)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--edge);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:0;border-bottom:3px solid transparent;border-radius:0;
  padding:11px 15px;color:var(--ink-3);white-space:nowrap;margin-bottom:-1px;box-shadow:none;min-height:0;
  transition:color .18s var(--ease),border-color .18s var(--ease);
}
.tab:hover{background:none;color:var(--ink-2);border-color:var(--edge)}
.tab.active{color:var(--ink);font-weight:700;border-bottom-color:var(--act)}
.live-grid{display:grid;gap:clamp(14px,2vw,22px)}
.lg-main{min-width:0}
.lg-side{min-width:0}
@media (min-width:900px){
  .live-grid{grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr);align-items:start}
  .lg-side{position:sticky;top:calc(env(safe-area-inset-top) + 128px);max-height:calc(100dvh - 190px);overflow-y:auto;padding-left:4px}
  .lg-side .section-h{margin-top:0}
}

/* ============ the table cards (hero) ============ */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));gap:clamp(10px,1.4vw,14px)}
.table{
  position:relative;border-radius:var(--r-hard);padding:13px;min-height:146px;
  color:var(--chalk);background:linear-gradient(160deg,var(--felt-2),var(--felt) 62%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),var(--shadow-1);
  display:flex;flex-direction:column;justify-content:space-between;
  animation:tableIn .3s var(--ease) both;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
}
@keyframes tableIn{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}
.table::before{ /* centre line */
  content:"";position:absolute;inset:3px;border-radius:3px;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.5) calc(50% - 1px),rgba(255,255,255,.5) calc(50% + 1px),transparent calc(50% + 1px));
}
.table::after{ /* net */
  content:"";position:absolute;left:-4px;right:-4px;top:50%;height:14px;transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 1px,transparent 1px 4px),rgba(255,255,255,.12);
  border-top:2px solid rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.25);
  pointer-events:none;opacity:.55;
}
.table.free{background:var(--felt-3);color:rgba(255,255,255,.62);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}
.table.free::before,.table.free::after{opacity:.28}
.table.busy{cursor:pointer}
.table.busy:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.95),var(--shadow-2)}
/* הבהוב צל מצייר מחדש כל פריים ותוקע גלילה: מהבהבים כמה פעמים ונשארים מסומנים בקו קבוע */
.table.stuck{box-shadow:inset 0 0 0 3px var(--ball),0 0 0 5px rgba(154,107,24,.3);animation:tableIn .3s var(--ease) both,alertPulse 1.9s 1.2s 2}
/* משחק שנכנס לשולחן ב-3 הדקות האחרונות: זוהר ושמות גדולים, כדי לקרוא לילדים */
.table.fresh{box-shadow:inset 0 0 0 3px #ffd34d,0 0 10px 2px rgba(255,200,40,.55);animation:tableIn .3s var(--ease) both,freshGlow 1.4s 2}
.table.fresh .players{font-size:clamp(19px,1.6vw,24px)}
.table .new-tag{position:relative;z-index:2;align-self:center;background:var(--ball);color:#fff;font-weight:700;font-size:.8em;padding:2px 10px;border-radius:999px}
@keyframes freshGlow{0%,100%{box-shadow:inset 0 0 0 3px #ffd34d,0 0 10px 2px rgba(255,200,40,.55)}50%{box-shadow:inset 0 0 0 4px #ffe58a,0 0 26px 8px rgba(255,200,40,.85)}}
@keyframes alertPulse{0%,100%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),var(--shadow-1)}50%{box-shadow:inset 0 0 0 3px var(--ball),0 0 0 5px rgba(154,107,24,.3)}}
.table .tnum{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.76em;opacity:.85;font-weight:500}
.table .tnum .lock{
  font-size:.9em;background:rgba(0,0,0,.28);padding:4px 10px;border-radius:var(--r-pill);
  cursor:pointer;border:0;color:#fff;min-height:0;box-shadow:none;
}
.table .tnum .lock:hover{background:rgba(0,0,0,.42)}
.table .players{position:relative;z-index:2;font-weight:600;font-size:clamp(15px,1.15vw,17.5px);line-height:1.24;text-align:center;margin:10px 0;text-shadow:0 1px 2px rgba(0,0,0,.22)}
.table .players .vs{display:block;font-size:.62em;font-weight:400;opacity:.7;margin:3px 0}
.table .meta{position:relative;z-index:2;font-size:.76em;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.table .free-lbl{position:relative;z-index:2;text-align:center;font-family:"Assistant",sans-serif;font-weight:700;font-size:clamp(16px,1.3vw,19px);margin:auto;letter-spacing:.02em}
.table.drop{outline:3px dashed var(--ball);outline-offset:-3px}
.table.clearing{animation:clearWipe .42s var(--ease) both}
@keyframes clearWipe{0%{filter:brightness(1.5)}100%{filter:none}}

/* ============ queue ============ */
.queue{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.queue li{
  display:flex;align-items:center;gap:10px;padding:11px 13px;background:#fff;
  border:1px solid var(--edge);border-radius:12px;border-right:5px solid var(--gc,var(--ink-3));
  cursor:grab;animation:rowIn .24s var(--ease) both;
}
.queue li:hover{border-color:#B7C1BF}
.queue li .who{flex:1;font-weight:500;min-width:0}
.queue li .why{font-size:.76em;color:var(--ink-3);font-weight:400;margin-top:3px}
.queue li .rest{font-size:.78em;color:var(--warn);white-space:nowrap}
.idle-warn{color:var(--warn);font-weight:600}
.idle-bad{color:var(--bad);font-weight:600;animation:idleBlink 2.2s infinite}
@keyframes idleBlink{0%,100%{opacity:1}50%{opacity:.55}}
.toggle{
  display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
  padding:10px 15px;min-height:var(--tap);border:1px solid var(--edge);border-radius:12px;background:#fff;
}
.toggle:hover{border-color:#B7C1BF}
.toggle i{width:40px;height:23px;border-radius:var(--r-pill);background:#B7C1BF;position:relative;transition:background .22s var(--ease);flex:none}
.toggle i::after{content:"";position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:right .22s var(--ease)}
.toggle.on i{background:var(--act)}
.toggle.on i::after{right:20px}

/* ============ scoresheet tables ============ */
table.st{width:100%;border-collapse:collapse;font-size:.88em}
table.st th,table.st td{padding:9px 7px;text-align:center;white-space:nowrap}
table.st th{font-weight:400;color:var(--ink-3);font-size:.82em;border-bottom:2px solid var(--edge)}
table.st td{border-bottom:1px solid var(--rule)}
table.st td.name{text-align:right;font-weight:500;white-space:normal}
table.st tbody tr:nth-child(even) td,table.st tr:nth-child(even) td{background:#FAFBFB}
table.st tr.q td{background:#E7F1ED;box-shadow:inset 3px 0 0 var(--ok)}
table.st tr.c td{background:#F7EFDD;box-shadow:inset 3px 0 0 var(--warn)}
table.st tr{transition:transform .5s var(--ease)}
table.st tr.moved{animation:climb .55s var(--ease) both}
@keyframes climb{0%{background:var(--ball-soft)}100%{background:transparent}}
.tb{
  display:inline-flex;align-items:center;justify-content:center;margin-right:6px;
  width:24px;height:24px;border-radius:50%;background:var(--rule);color:var(--ink-2);
  font-size:.72em;border:0;padding:0;min-height:0;box-shadow:none;
}
.tb:hover{background:var(--ball);color:#fff}
.matchlist{list-style:none;margin:10px 0 0;padding:0;font-size:.88em}
.matchlist li{display:flex;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px solid var(--rule)}
.matchlist li:last-child{border-bottom:0}
.matchlist li .sc{font-family:"Assistant",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.05em}
.matchlist li .edit{color:var(--ink-3);font-size:.82em;background:none;border:0;padding:2px 6px;min-height:0;box-shadow:none}
.matchlist li .edit:hover{color:var(--ball);background:none}

/* ============ bracket ============ */
.bracket{display:flex;gap:clamp(16px,2.4vw,30px);overflow-x:auto;padding:6px 0 20px;-webkit-overflow-scrolling:touch}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:190px;flex:none}
.round h4{margin:0 0 2px;font-size:.78em;color:var(--ink-3);font-weight:400;text-align:center}
.bm{background:#fff;border:1px solid var(--edge);border-radius:10px;overflow:hidden;font-size:.88em;box-shadow:var(--shadow-1);transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.bm div{display:flex;justify-content:space-between;gap:8px;padding:9px 12px}
.bm div+div{border-top:1px solid var(--rule)}
.bm .w{font-weight:700;color:var(--act-2);background:var(--act-soft)}
.bm .bye{color:var(--ink-3);font-style:italic}
.bm .sc{font-family:"Assistant",sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.bm.live{border-color:var(--ball);box-shadow:0 0 0 3px rgba(154,107,24,.2)}

/* ============ podium ============ */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,1.4vw,14px);margin:26px 0 30px;min-height:230px}
.pod{flex:1;max-width:230px;text-align:center}
.pod .name{font-weight:600;font-size:clamp(15px,1.5vw,20px);margin-bottom:10px;min-height:52px;display:flex;align-items:flex-end;justify-content:center}
.pod .block{
  font-family:"Assistant",sans-serif;font-weight:800;background:var(--felt);color:#fff;border-radius:10px 10px 0 0;
  font-size:clamp(30px,4vw,46px);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.16);transform-origin:bottom;animation:rise .55s var(--ease) both;
}
.pod.p1 .block{height:clamp(110px,15vw,158px);background:var(--ball);box-shadow:inset 0 -7px 0 var(--ball-2);animation-delay:.24s}
.pod.p2 .block{height:clamp(84px,11vw,116px);animation-delay:.1s}
.pod.p3 .block{height:clamp(62px,8vw,86px);background:var(--felt-3);animation-delay:0s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ============ modal ============ */
.modal-bg{
  position:fixed;inset:0;background:rgba(27,36,43,.5);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;
  animation:fadeIn .18s var(--ease) both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:580px;
  max-height:92dvh;overflow:auto;padding:22px 18px calc(26px + env(safe-area-inset-bottom));
  animation:sheetUp .28s var(--ease) both;
}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:720px){
  .modal-bg{align-items:center;padding:24px}
  .modal{border-radius:20px;padding:26px;animation:popIn .22s var(--ease) both}
  @keyframes popIn{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
}
.modal h2{margin-bottom:6px}
.names{display:grid;grid-template-columns:1fr 40px 1fr;gap:10px;text-align:center;font-weight:600;font-size:clamp(15px,1.3vw,18px);align-items:start}
.names>div:first-child{border-bottom:4px solid var(--rubber);padding-bottom:8px}
.names>div:last-child{border-bottom:4px solid var(--pip);padding-bottom:8px}
.names .setsw{display:block;font-family:"Assistant",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(30px,4vw,40px);color:var(--act);line-height:1.1;margin-top:4px}
.sets{display:grid;gap:9px;margin:16px 0}
.set{display:grid;grid-template-columns:1fr 40px 1fr;gap:10px;align-items:center}
.set input{
  text-align:center;font-family:"Assistant",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(24px,3.4vw,30px);
  padding:12px 4px;border-width:2px;border-radius:12px;min-height:56px;
}
.set input:focus{border-color:var(--act);box-shadow:0 0 0 4px rgba(59,90,127,.14)}
.set input:disabled{background:var(--paper);color:var(--ink-3);border-color:var(--rule)}
.set input.bad{border-color:var(--bad);background:#F8EAE8}
.set .x{text-align:center;color:var(--ink-3);font-size:.85em}
.quick{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}
.quick button{font-size:.9em;padding:8px 13px;min-height:44px}

/* ============ toast ============ */
.toast{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
  background:var(--ink);color:#fff;padding:13px 17px;border-radius:14px;
  display:flex;gap:16px;align-items:center;z-index:60;box-shadow:var(--shadow-2);
  max-width:min(92vw,520px);animation:toastUp .3s var(--ease) both;
}
@keyframes toastUp{from{transform:translate(-50%,18px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast button{background:#fff;color:var(--ink);border:0;padding:8px 16px;min-height:44px;font-weight:700}
.toast button:hover{background:var(--act-soft)}

/* ============ login / list ============ */
.login{max-width:400px;margin:clamp(24px,7vh,64px) auto}
.tlist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.tlist li{
  background:#fff;border:1px solid var(--edge);border-radius:var(--r-soft);padding:16px 18px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;
  box-shadow:var(--shadow-1);animation:rowIn .28s var(--ease) both;
  transition:border-color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease);
}
.tlist li:hover{border-color:var(--act);transform:translateY(-2px);box-shadow:var(--shadow-2)}
.tlist .tn{font-weight:700;font-size:1.18em}
.tlist .chev{color:var(--ink-3);font-size:1.4em;line-height:1}
.hero{background:linear-gradient(160deg,#EAF0F5 0%,#F7FAFC 100%);border-radius:22px;padding:24px 22px;margin-bottom:20px;box-shadow:var(--shadow-2)}
.hero .lbl{color:var(--ink-2);font-size:.95em}
.hero h2{font-size:clamp(24px,2.4vw,30px);font-weight:800;margin:8px 0 6px}
.hero .meta{color:var(--ink-2);margin-bottom:18px}
.hero button{width:100%}
.list-h{font-size:1em;font-weight:600;color:var(--ink-2);margin:4px 0 10px}
.tlist .tm{font-size:.84em;color:var(--ink-3);margin-top:3px}

/* ============ hall display ============ */
.public{
  position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,var(--felt-2),var(--felt-3) 78%);
  color:#fff;z-index:100;padding:clamp(18px,3vw,34px);overflow:auto;
  animation:fadeIn .3s var(--ease) both;
}
.public h1{font-size:clamp(26px,4vw,46px);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.public .tables{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:clamp(12px,1.6vw,18px)}
.public .table{min-height:clamp(150px,20vh,200px)}
.public .table .players{font-size:clamp(19px,2.4vw,30px)}
.public .next{margin-top:26px}
.public .next h2{font-size:clamp(20px,2.4vw,30px);margin-bottom:10px;color:#D4B977}
.public .next ul{padding:0;margin:0}
.public .next li{
  font-size:clamp(17px,2vw,26px);padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.14);
  list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:baseline;
  animation:rowIn .34s var(--ease) both;
}
.public .next li small{opacity:.65;font-size:.66em}
.public .pod .block{animation:none}

/* ============ responsive ============ */
@media (max-width:600px){
  .toolbar button{flex:1 1 auto}
  .toolbar button.big{flex-basis:100%}
  .stat{gap:16px}
  .set{grid-template-columns:1fr 30px 1fr}
  table.st{font-size:.82em}
  table.st th,table.st td{padding:8px 4px}
}
@media (min-width:601px) and (max-width:1024px){
  .tables{grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr))}
}
@media (max-height:520px) and (orientation:landscape){
  header{position:static}
  .modal{max-height:96dvh;padding-top:14px}
  .set input{min-height:44px;font-size:22px;padding:6px 4px}
  .names .setsw{font-size:26px}
}
@media (hover:none){
  button:hover,.chip:hover,.tlist li:hover,.table.busy:hover{transform:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media print{
  header,.toolbar,.tabs,.progress,button,#tSearch,#tSearchOut,.live-grid .lg-side{display:none!important}
  main{padding:0;max-width:none}
  body{background:#fff;font-size:11pt}
  .card,.group{box-shadow:none;break-inside:avoid}
  .table{color:#000;background:#fff!important;box-shadow:inset 0 0 0 1px #000}
  .table::after,.table::before{display:none}
}
/* ---- ליטוש בסגנון אפל: חיפוש, מצב שחקנים, דף דירוג (17.10) ---- */
.tiny{font-size:max(.85em,14px)}
table.st th{font-size:max(.82em,13px)}
.pill{font-size:max(.78em,13px)}
.search{position:relative;flex:1 1 260px;max-width:380px}
.search input{width:100%;min-height:52px;padding:12px 44px 12px 14px;border-radius:14px;background:#EEF1F0;border:1px solid transparent;font-size:17px;transition:background .15s,border-color .15s,box-shadow .15s}
.search input:focus{background:#fff;border-color:var(--act);box-shadow:0 0 0 4px rgba(59,90,127,.15);outline:none}
.search::before{content:"";position:absolute;inset-inline-start:14px;top:50%;width:20px;height:20px;margin-top:-10px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23606E77' stroke-width='2.4' stroke-linecap='round'><circle cx='10.5' cy='10.5' r='6.5'/><path d='M20 20l-4.6-4.6'/></svg>") center/contain no-repeat;pointer-events:none}
#tSearchOut .card{animation:cardIn .22s var(--ease) both;border-radius:18px}
@keyframes cardIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.stage-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:15px;font-weight:600;background:var(--rule);color:var(--ink-2)}
.tag.ok{background:#E3F1EC;color:#1F5F50}.tag.end{background:#F6E4E1;color:#8E3A31}.tag.live{background:var(--act-soft);color:var(--act-2)}
.pp{border-radius:20px;padding:0;overflow:hidden}
.pp>summary{list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;cursor:pointer;font-weight:700;font-size:18px}
.pp>summary::-webkit-details-marker{display:none}
.pp>summary::after{content:"";width:9px;height:9px;border-inline-start:2.5px solid var(--ink-3);border-bottom:2.5px solid var(--ink-3);transform:rotate(-45deg);margin-inline-start:auto;transition:transform .2s var(--ease)}
.pp[open]>summary::after{transform:rotate(135deg)}
.pp-body{padding:0 18px 16px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:#EEF1F0;margin:4px 0 12px;flex-wrap:wrap}
.seg button{min-height:40px;padding:6px 14px;border:0;border-radius:10px;background:transparent;box-shadow:none;font-size:15px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(27,36,43,.15)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--rule)}
.prow:last-child{border-bottom:0}
.prow .n{font-weight:700;font-size:16px}.prow .s{font-size:14px;color:var(--ink-3);margin-top:2px}
.prow .tag{flex:none;white-space:nowrap}
@media (max-width:600px){.prow{flex-wrap:wrap}.search{max-width:none}}
@media (prefers-reduced-motion:reduce){#tSearchOut .card{animation:none}.pp>summary::after{transition:none}}
/* ליגה לאומית — טופס משחק */
.lg-score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;font-weight:700;font-size:clamp(15px,1.4vw,19px)}
.lg-score .n{font-family:"Assistant",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(34px,5vw,48px);color:var(--act);line-height:1.1}
.lg-score .n.win{color:var(--ok)}
.lg-game{padding:12px 14px}
.lg-game.wait{opacity:.55}
.lg-game h3 .tag:empty{display:none}
.lg-game.open{border-color:var(--act);box-shadow:0 0 0 3px rgba(59,90,127,.12)}
.lg-game h3{font-size:1em;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.lg-game h3 .tag{font-weight:600;color:var(--ok)}
.lg-row{display:grid;grid-template-columns:minmax(70px,1fr) repeat(5,minmax(40px,48px)) 34px;gap:6px;align-items:center;padding:4px 0}
.lg-row .nm{font-weight:600;font-size:.95em;line-height:1.2;overflow-wrap:anywhere}
.lg-row .nm b{color:var(--ink-3);font-weight:400;font-size:.85em}
.lg-row input{text-align:center;font-family:"Assistant",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:20px;padding:8px 2px;border-width:2px;border-radius:10px;min-height:48px;width:100%}
.lg-row input:focus{border-color:var(--act);box-shadow:0 0 0 4px rgba(59,90,127,.14)}
.lg-row input:disabled{background:var(--paper);color:var(--ink-3);border-color:var(--rule)}

.lg-pl .lt{margin-top:7px;margin-inline-end:0}

<body>
<header>
  <div class="brand">
    <div class="logo"><i></i><div class="logotext"><span class="appname">תן לי שולחן</span><span class="club" id="hdrName">מועדון טניס שולחן מבואות החרמון ע"ש רוני גלבוע</span></div></div>
    <div class="acts">
      <button id="syncBtn" class="ghost sync" onclick="diagnostics()" title="מצב השמירה"><span id="syncDot"></span><span id="syncTxt"></span></button>
      <button class="ghost" id="btnList" onclick="closeTournament()">כל התחרויות</button>
      <button class="ghost" id="btnOut" onclick="FB.signOut()">יציאה</button>
    </div>
  </div>
  <nav class="steps" id="steps"></nav>
</header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast"></div>
<div id="public"></div>

<script>
/* ========================= STATE ========================= */
const KEY='tenlishulchan.v1';
// עדכון אוטומטי: מכשיר שמחזיק גרסה ישנה (אייקון במסך הבית, לשונית פתוחה) נטען מחדש לבד כשעולה גרסה חדשה, רק כשאין חלון פתוח
const APP_VER='2026-11-01.7';
let verTag=null;
// קודם בודקים רק את הכותרות (כמה בתים); את הדף כולו (230KB) מורידים רק כשהוא באמת השתנה
function checkUpdate(){if(document.querySelector('#modal .modal'))return;fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(r=>{const tag=r.headers.get('etag')||r.headers.get('last-modified');if(tag&&tag===verTag)return;verTag=tag;fullCheck()}).catch(()=>{})}
function fullCheck(){fetch(location.pathname+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const v=(t.match(/APP_VER='([^']+)'/)||[])[1];if(v&&v!==APP_VER&&!document.querySelector('#modal .modal'))location.reload()}).catch(()=>{})}
setInterval(checkUpdate,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
const CLUB_NAME='מועדון טניס שולחן מבואות החרמון ע"ש רוני גלבוע';
const GROUP_COLORS=['#2E7D6B','#3B5A7F','#B24B41','#6B5B95','#9A6B18','#2F7F86','#9A4F76','#5B7340','#4E6E95','#7A6450'];
const DEF={
  phase:'setup',
  settings:{name:'',date:new Date().toISOString().slice(0,10),system:'groups-ko',format:'singles',boGroup:5,boKO:5,tables:4,groupSize:4,advance:2,consolation:true,third:false,restMin:5,model:'group',auto:true,stuckMult:1.5,swissRounds:5,swissKO:false,swissAdvance:4,rounds:6,target:21,kingTarget:11},
  players:[],groups:[],matches:[],tables:[],lots:{},log:[],lastPlayed:{},tab:'dash',avgDur:{}, koBuilt:false, lastUndo:null, kingQueue:[], kingHolders:{}, byes:[]
};
let S=fresh();
function fresh(){const o=JSON.parse(JSON.stringify(DEF));o.settings.date=todayIL();return o}
// התאריך של היום לפי שעון ישראל (YYYY-MM-DD), מחושב מחדש בכל תחרות חדשה ולא פעם אחת בטעינה ב-UTC.
function todayIL(){try{const p={};new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);if(p.year&&p.month&&p.day)return p.year+'-'+p.month+'-'+p.day}catch(e){}return new Date().toISOString().slice(0,10)}
// הלשונית והמסך (tab, phase) של כל מכשיר לעצמו: שינוי רק שלהם נשמר במכשיר ולא נשלח לענן (אחרת כל המכשירים זזים איתו)
let lastSig=null;
function stSig(){return JSON.stringify(S,(k,v)=>k==='tab'||k==='phase'||k==='rev'?undefined:v)}
function save(){if(!TID)return;const sig=stSig(),changed=sig!==lastSig;lastSig=sig;if(changed)S.rev=(S.rev||0)+1;try{localStorage.setItem(KEY+'.'+TID,JSON.stringify(S))}catch(e){}if(changed)scheduleCloud()}
function uid(){return Math.random().toString(36).slice(2,9)}
function logEv(t,kind){
  S.log.unshift({t:Date.now(),m:t,by:(PROFILE&&PROFILE.name)||(USER&&USER.email)||'',k:kind||'',d:S.rev||0});
  if(S.log.length>800)S.log.length=800;
}
function P(id){return S.players.find(p=>p.id===id)}
function pname(id){return id==null?'—':(P(id)?P(id).name:'?')}
function G(id){return S.groups.find(g=>g.id===id)}
function gcolor(gid){const i=S.groups.findIndex(g=>g.id===gid);return GROUP_COLORS[(i<0?0:i)%GROUP_COLORS.length]}
function needSets(m){const bo=(m.stage==='group'||m.stage==='swiss')?S.settings.boGroup:S.settings.boKO;return Math.ceil(bo/2)}
function sys(){return S.settings.system||'groups-ko'}
function isPointGame(m){return m.stage==='round'||m.stage==='king'}
function sideIds(m,i){return i===1?(m.t1||(m.p1?[m.p1]:[])):(m.t2||(m.p2?[m.p2]:[]))}
function sideName(m,i){const a=sideIds(m,i);return a.length?a.map(pname).join(' / '):'—'}
function matchPids(m){return [...sideIds(m,1),...sideIds(m,2)]}
const SYSTEMS={
 'groups-ko':{n:'בתים + נוקאאוט',d:'הקלאסי: כל אחד משחק בבית קטן, המובילים עולים לעץ הדחה.',steps:['setup','players','draw','live','ko','final'],live:'שלב הבתים'},

 'americano':{n:'אמריקנו — זוגות מתחלפים',d:'מחליפים פרטנר בכל סיבוב, הניקוד אישי. הכי חברתי.',steps:['setup','players','live','final'],live:'סיבובים'},
 'mexicano':{n:'מקסיקנו',d:'כמו אמריקנו, אבל הזוגות נקבעים לפי הטבלה החיה — המשחקים נהיים צמודים.',steps:['setup','players','live','final'],live:'סיבובים'},
 'king':{n:'מלך השולחן',d:'המנצח נשאר, המפסיד יורד והבא בתור נכנס. משחקים קצרים, תור מהיר.',steps:['setup','players','live','final'],live:'מלך השולחן'}
};
function isTeamSys(){return sys()==='americano'||sys()==='mexicano'}
function fmtTime(ts){const d=new Date(ts);return d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}
function mins(ms){return Math.round(ms/60000)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// ערך שנכנס למחרוזת JS בתוך onclick='...': הדפדפן מפענח &#39; בחזרה לגרש לפני שה-JS רץ, לכן esc לבד לא מספיק.
// כל תו שאינו אות/ספרה לטינית הופך ל-\uXXXX, כך שאי אפשר לצאת מהמחרוזת. למזהים רגילים (uid) הפלט זהה לקלט.
function ja(s){return esc(`${s}`.replace(/[^A-Za-z0-9_\-]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0')))}
function commit(){koSync();save();render();queueMicrotask(markMoves)}
let _ranks={};
function markMoves(){
  const rows=document.querySelectorAll('table.st tr[data-pid]');
  if(!rows.length){return}
  const next={};let i=0;
  rows.forEach(tr=>{const k=tr.dataset.pid;next[k]=i++});
  if(Object.keys(_ranks).length){
    rows.forEach(tr=>{const k=tr.dataset.pid;
      if(_ranks[k]!==undefined&&_ranks[k]!==next[k])tr.classList.add('moved')});
  }
  _ranks=next;
}

const STEP_NAMES={setup:'הגדרות',players:'שחקנים',draw:'הגרלה',live:'משחקים',ko:'נוקאאוט',final:'פודיום'};
function steps(){const st=SYSTEMS[sys()].steps.slice();if(sys()==='swiss'&&!S.settings.swissKO)return st.filter(x=>x!=='ko');return st}
function stepIndex(p){return steps().indexOf(p)}
function goto(p){S.phase=p;commit();window.scrollTo(0,0)}
function renderSteps(){
  const cur=stepIndex(S.phase);
  const reach={setup:true,players:true,draw:S.groups.length>0,live:S.matches.length>0,ko:S.koBuilt||(sys()==='groups-ko'&&S.matches.length>0),final:canFinish()};
  const lbl=Object.assign({},STEP_NAMES,{live:SYSTEMS[sys()].live});
  document.getElementById('steps').innerHTML=steps().map((k,i)=>`<button class="step ${i<cur?'done':''} ${i===cur?'active':''}" ${reach[k]?'':'disabled'} onclick="${k==='ko'&&!S.koBuilt?"S.tab='bracket';":''}goto('${k}')">${lbl[k]}</button>`).join('');
  document.getElementById('hdrName').textContent=S.settings.name||CLUB_NAME;
}

/* ========================= RENDER ========================= */
function render(remote){
  if(S.phase==='setup'&&!remote)keepSetup();
  const app=document.getElementById('app');
  document.getElementById('btnList').style.display=TID?'':'none';document.getElementById('btnOut').style.display=USER&&!TID?'':'none';document.getElementById('syncBtn').style.display=TID||syncErr?'':'none';document.querySelector('header').classList.toggle('has-steps',!!(USER&&PROFILE&&TID)&&sys()!=='league');
  if((!window.FB||BOOTED)&&!TID){app.innerHTML='<p class="muted" style="text-align:center;margin-top:60px">טוען…</p>';return}
  if(VIEW){document.getElementById('steps').innerHTML='';document.getElementById('hdrName').textContent=S.settings.name||CLUB_NAME;return renderView(app)}
  if(!USER){document.getElementById('steps').innerHTML='';return renderLogin(app)}
  if(!PROFILE){document.getElementById('steps').innerHTML='';app.innerHTML='<div class="card login"><h2>אין הרשאה</h2><p class="muted">המשתמש הזה לא מוגדר במערכת הנוכחות של המועדון. בקשו משלום להוסיף אותו.</p><button onclick="FB.signOut()">יציאה</button></div>';return}
  if(!TID){document.getElementById('steps').innerHTML='';document.getElementById('hdrName').textContent=CLUB_NAME;return renderList(app)}
  if(sys()==='league'){document.getElementById('steps').innerHTML='';document.getElementById('hdrName').textContent=S.settings.name||CLUB_NAME;return renderLeague(app)}
  renderSteps();
  ({setup:renderSetup,players:renderPlayers,draw:renderDraw,live:renderLive,ko:renderLive,final:renderFinal})[S.phase](app);
}

  const calc=()=>{
    const n=document.querySelector('input[name=wz1]:checked').value,t=document.querySelector('input[name=wz2]:checked').value,k=document.querySelector('input[name=wz3]:checked').value;
    let r,why;

    else if(t==='short'&&(n==='l'||n==='xl')){r='swiss';why='הרבה משתתפים וזמן קצר: שוויצרית נותנת לכולם מספר קבוע של משחקים ומדרגת את כולם.'}
    else {r='groups-ko';why='תחרות רצינית עם זמן: בתים ואז נוקאאוט — התקן של ITTF.'}
    if(n==='s'&&k==='fun'&&t==='short'){r='king';why='קבוצה קטנה שרוצה כיף מהיר: מלך השולחן — משחקים קצרים ותור שזז.'}
    const extra=r==='swiss'?` מומלץ ${suggestSwissRounds(n==='l'?24:40)} סיבובים.`:r==='groups-ko'?` ${S.players.length?suggestText(S.players.length):'אחרי הזנת השחקנים אציע חלוקה לבתים.'}`:'';
    document.getElementById('wzOut').innerHTML=`<b>${SYSTEMS[r].n}</b><br>${esc(why)}${extra?'<br>'+esc(extra):''}`;

function keepSetup(){
  const s=S.settings;const q=id=>document.getElementById(id);if(!q('s_tables'))return;
  if(!S.matches.length){s.name=q('s_name').value.trim();s.date=q('s_date').value;

function syncTables(){
  const n=S.settings.tables=Math.max(1,Math.round(+S.settings.tables)||1);const before=S.tables.length;
  while(S.tables.length<n)S.tables.push({n:S.tables.length+1,lock:null,matchId:null,note:''});
  if(S.tables.length>n){const extra=S.tables.slice(n);if(extra.some(t=>t.matchId)){toast('יש שולחנות בשימוש. סיימו אותם קודם.');S.settings.tables=S.tables.length;return}S.tables.length=n;extra.forEach(t=>{const h=(S.kingHolders||{})[t.n];if(h&&P(h)&&!S.kingQueue.includes(h))S.kingQueue.unshift(h);if(S.kingHolders)delete S.kingHolders[t.n]})}
  let healed=false;
  for(const t of S.tables){
    if(!t.matchId)continue;
    const m=S.matches.find(x=>x.id===t.matchId);
    if(!m||m.status!=='playing'){t.matchId=null;healed=true}
  }
  for(const m of S.matches){
    if(m.status==='playing'&&!S.tables.some(t=>t.matchId===m.id)){m.status='pending';m.table=null;m.startedAt=null;healed=true}
  }
  if((S.tables.length!==before||healed)&&TID)save();
}

/* ---------- Structure planner ---------- */
function groupSizes(n,ng){const base=Math.floor(n/ng),rem=n%ng;return Array.from({length:ng},(_,i)=>base+(i<rem?1:0))}
function planFor(n,ng){
  const sizes=groupSizes(n,ng);
  const matches=sizes.reduce((a,x)=>a+x*(x-1)/2,0);
  const perPlayer=Math.min(...sizes)-1;
  const avg=avgDuration(S.settings.boGroup)/60000;
  const par=Math.max(1,Math.min(S.settings.tables,ng*(S.settings.model==='group'?1:99)));
  const est=Math.ceil(matches/Math.max(1,S.settings.tables)*avg);
  return {ng,sizes,matches,perPlayer,est,ok:Math.min(...sizes)>=3&&Math.max(...sizes)<=6};
}
function bestPlan(n){
  const opts=[];for(let ng=1;ng<=Math.floor(n/3);ng++){const pl=planFor(n,ng);if(pl.ok)opts.push(pl)}
  if(!opts.length)return [planFor(n,Math.max(1,Math.round(n/4)))];
  const target=S.settings.groupSize;
  const cost=p=>p.sizes.reduce((a,x)=>a+Math.abs(x-target),0);
  opts.sort((a,b)=>cost(a)-cost(b)||a.ng-b.ng);
  return opts;
}
function suggestText(n){
  if(sys()==='swiss'){const r=suggestSwissRounds(n);return `${n} רשומים — מומלץ ${r} סיבובים (כל אחד ישחק ${r} משחקים).`}
  if(isTeamSys()){const courts=Math.min(S.settings.tables,Math.floor(n/4));const sit=n-courts*4;return `${n} רשומים — ${courts} שולחנות פעילים בכל סיבוב${sit>0?`, ${sit} ינוחו בכל סיבוב בסבב`:''}.`}
  if(sys()==='king')return `${n} רשומים — תור אחד לכל שולחן, המנצח נשאר.`;
  const p=bestPlan(n)[0];
  return `${n} רשומים — מומלץ ${planDesc(p)}. כל אחד ישחק לפחות ${p.perPlayer} משחקים, סיום משוער אחרי כ-${p.est} דק׳.`;
}
function planDesc(p){
  // "6 בתים של 4" ולא "6×4": בעברית המספרים מתהפכים סביב ה-× ונקראים הפוך
  const uniq=[...new Set(p.sizes)].sort((a,b)=>b-a);const parts=uniq.map(u=>{const c=p.sizes.filter(x=>x===u).length;return c===1?`בית של ${u}`:`${c} בתים של ${u}`});
  return parts.length<2?parts[0]:parts.slice(0,-1).join(', ')+' ו'+(/^[0-9]/.test(parts[parts.length-1])?'-':'')+parts[parts.length-1];
}
function planCard(n){

  ${opts.map((p,i)=>`<tr style="cursor:pointer" onclick="S.settings.groupSize=${p.sizes[0]};S.planNg=${p.ng};commit()"><td>${(S.planNg&&opts.some(o=>o.ng===S.planNg)?S.planNg===p.ng:p.ng===rec)?'✅':'○'}</td><td><b>${p.ng}</b>${p.ng===rec?' <span class="tiny">(מומלץ)</span>':''}</td><td>${planDesc(p)}</td><td>${p.matches}</td><td>${p.perPlayer}</td><td>~${p.est} דק׳</td></tr>`).join('')}
  </table></div></div>`;
}

/* ---------- Draw (snake seeding) ---------- */
function makeDraw(keepManual){
  const n=S.players.length;
  const plans=bestPlan(n);let ng=plans.some(x=>x.ng===S.planNg)?S.planNg:plans[0].ng;
  const s1=S.players.filter(p=>p.seed===1).length;if(s1>ng)ng=s1;
  if(n/ng<3&&ng>1)ng=Math.max(1,Math.floor(n/3));
  buildGroups(ng);goto('draw');
}
function buildGroups(ng){
  const groups=[];for(let i=0;i<ng;i++)groups.push({id:uid(),name:'בית '+String.fromCharCode(65+i),pids:[]});
  const bySeed=s=>shuffle(S.players.filter(p=>p.seed===s));
  const seeds=[...bySeed(1),...bySeed(2),...bySeed(3)];
  // snake
  let dir=1,gi=0;
  seeds.forEach((p,i)=>{groups[gi].pids.push(p.id);if(dir===1){if(gi===ng-1)dir=-1;else gi++}else{if(gi===0)dir=1;else gi--}});
  // unseeded: balanced random with club separation
  const rest=shuffle(S.players.filter(p=>p.seed===0));
  for(const p of rest){
    const minLen=Math.min(...groups.map(g=>g.pids.length));
    let cands=groups.filter(g=>g.pids.length===minLen);
    const noClub=cands.filter(g=>!p.club||!g.pids.some(id=>P(id).club&&P(id).club===p.club));
    if(noClub.length)cands=noClub;
    cands[Math.floor(Math.random()*cands.length)].pids.push(p.id);
  }
  S.groups=groups;
}

/* ---------- Group schedule (circle method, 1v2 last) ---------- */
function groupSchedule(n){
  const ids=[];for(let i=1;i<=n;i++)ids.push(i);if(n%2)ids.push(0);
  const m=ids.length,rounds=[];let arr=ids.slice();
  for(let r=0;r<m-1;r++){const rm=[];for(let i=0;i<m/2;i++){const a=arr[i],b=arr[m-1-i];if(a&&b)rm.push([a,b])}rounds.push(rm);arr=[arr[0],arr[m-1],...arr.slice(1,m-1)]}
  const li=rounds.findIndex(r=>r.some(([a,b])=>(a===1&&b===2)||(a===2&&b===1)));if(li>=0){const x=rounds.splice(li,1)[0];rounds.push(x)}
  return rounds;
}
function seedOrderInGroup(g){return g.pids.slice().sort((a,b)=>{const sa=P(a).seed||9,sb=P(b).seed||9;return sa-sb})}
function confirmDraw(){
  if(S.matches.some(m=>m.status==='done')&&!confirm('יש כבר תוצאות. הגרלה מחדש תמחק את כולן. להמשיך?'))return;
  S.tables.forEach(t=>t.matchId=null);S.matches=[];S.koBuilt=false;S.koRounds=0;S.consRounds=0;S.lots={};S.lastUndo=null;
  for(const g of S.groups){
    const order=seedOrderInGroup(g);
    groupSchedule(order.length).forEach((rm,ri)=>rm.forEach(([a,b])=>S.matches.push(newMatch({stage:'group',groupId:g.id,round:ri+1,p1:order[a-1],p2:order[b-1]}))));
  }
  syncTables();applyModelLocks();S.lastPlayed={};S.phaseStart=Date.now();
  logEv(`ההגרלה אושרה — ${S.groups.length} בתים, ${S.players.length} שחקנים`,'draw');goto('live');
  if(S.settings.auto)autoDistribute();
}
function newMatch(o){return Object.assign({id:uid(),sets:[],status:'pending',table:null,winner:null,wo:false,startedAt:null,endedAt:null},o)}
function applyModelLocks(){
  const m=S.settings.model;
  if(m==='pool'){S.tables.forEach(t=>t.lock=null);return}
  if(m==='group'){
    S.tables.forEach(t=>t.lock=null);
    const gs=S.groups.slice();
    if(gs.length>S.tables.length){gs.slice(0,S.tables.length-1).forEach((g,i)=>S.tables[i].lock=g.id);S.settings.model='hybrid';return}
    gs.forEach((g,i)=>{if(S.tables[i])S.tables[i].lock=g.id});
    // extras to largest groups
    const extra=S.tables.slice(gs.length);const byLen=gs.slice().sort((a,b)=>b.pids.length-a.pids.length);
    extra.forEach((t,i)=>t.lock=byLen[i%byLen.length].id);
  }
}

/* ========================= ENGINE: results & standings ========================= */
function setsWon(m){let a=0,b=0;for(const [x,y] of m.sets){if(x>y)a++;else if(y>x)b++}return [a,b]}
function validSet(a,b){if(a==null||b==null||isNaN(a)||isNaN(b))return false;const hi=Math.max(a,b),lo=Math.min(a,b);if(hi<11)return false;if(hi===11)return lo<=9;return hi-lo===2}
// 1, 2 ו-3 יכולים להיות תחילת 10+, 20+ או 30+ (דיוס), אז עוברים למשבצת הבאה רק כשהמספר בטוח שלם
function scoreDone(v){return v.length===2||+v>=4}
function otherScore(v){if(v<=9)return 11;if(v===10)return 12;return v+2}
function playerStats(pid,ms){
  let mp=0,w=0,l=0,sw=0,sl=0,pw=0,pl=0,played=0;
  for(const m of ms){if(m.status!=='done')continue;const me=m.p1===pid?0:m.p2===pid?1:-1;if(me<0)continue;played++;
    const [a,b]=setsWon(m);const ws=me?b:a,ls=me?a:b;sw+=ws;sl+=ls;
    for(const [x,y] of m.sets){pw+=me?y:x;pl+=me?x:y}
    if(m.winner===pid){w++;mp+=2}else{l++;mp+=(m.wo||m.retired===pid)?0:1}}
  return {mp,w,l,sw,sl,pw,pl,played,sr:sl?sw/sl:(sw?Infinity:0),pr:pl?pw/pl:(pw?Infinity:0)};
}
function rankGroup(gid){
  const g=G(gid);const ms=S.matches.filter(m=>m.stage==='group'&&m.groupId===gid);
  const explain={};g.pids.forEach(id=>explain[id]=[]);
  const order=resolve(g.pids.slice(),ms,explain,gid,0);
  return {order,explain,stats:Object.fromEntries(g.pids.map(id=>[id,playerStats(id,ms)]))};
}
function resolve(pids,ms,explain,gid,depth){
  if(pids.length===1)return pids;
  const sub=ms.filter(m=>m.status==='done'&&pids.includes(m.p1)&&pids.includes(m.p2));
  const st={};pids.forEach(id=>st[id]=playerStats(id,sub));
  const crit=[['mp','נקודות משחק',id=>st[id].mp],['sr','יחס מערכות',id=>st[id].sr],['pr','יחס נקודות',id=>st[id].pr]];
  const scope=depth===0?'':' (רק במשחקים בין השווים)';
  for(const [k,label,f] of crit){
    const vals=new Set(pids.map(f));
    const fmt=id=>k==='mp'?st[id].mp:k==='sr'?`${st[id].sw}:${st[id].sl}`:`${st[id].pw}:${st[id].pl}`;
    if(vals.size===1){if(depth>0||k!=='mp')pids.forEach(id=>explain[id].push(`${label}${scope}: ${fmt(id)} — שווה, ממשיכים לשובר הבא`));continue}
    const sorted=pids.slice().sort((a,b)=>f(b)-f(a));
    const parts=[];for(const id of sorted){const v=f(id);const last=parts[parts.length-1];if(last&&f(last[0])===v)last.push(id);else parts.push([id])}
    if(depth>0||k!=='mp')pids.forEach(id=>explain[id].push(`${label}${scope}: ${fmt(id)} — הכריע`));
    if(parts.length===1)continue;
    let out=[];
    for(const part of parts){
      if(part.length===1)out.push(part[0]);
      else{part.forEach(id=>explain[id].push(`עדיין שוויון בין ${part.map(pname).join(', ')} — מתחילים מחדש רק ביניהם`));out=out.concat(resolve(part,ms,explain,gid,depth+1))}
    }
    return out;
  }
  // full tie -> lot
  const key=gid+':'+pids.slice().sort().join(',');
  const hh=x=>{let h=2166136261;for(const c of key+'#'+x)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
  const lot=(S.lots[key]||pids.slice().sort((a,b)=>hh(a)-hh(b))).filter(id=>pids.includes(id));
  pids.forEach(id=>explain[id].push('שוויון מוחלט — המיקום נקבע בהגרלה'));
  return lot;
}
function groupDone(gid){return S.matches.filter(m=>m.stage==='group'&&m.groupId===gid).every(m=>m.status==='done')}
function allGroupsDone(){return S.matches.some(m=>m.stage==='group')&&S.matches.filter(m=>m.stage==='group').every(m=>m.status==='done')}

/* ========================= ENGINE: scheduling ========================= */
function busyPids(){const s=new Set();for(const m of S.matches)if(m.status==='playing')matchPids(m).forEach(id=>s.add(id));return s}
function idleSince(pid){return S.lastPlayed[pid]||S.phaseStart||Date.now()}
function pendingMatches(){return S.matches.filter(m=>m.status==='pending'&&sideIds(m,1).length&&sideIds(m,2).length&&(m.stage!=='ko'||S.koBuilt||S.koGo))}
function groupProgress(gid){const ms=S.matches.filter(m=>m.stage==='group'&&m.groupId===gid);return ms.length?ms.filter(m=>m.status==='done').length/ms.length:1}
function priority(m,now){
  const why=[];let sc=0;
  if(m.stage==='group'){
    const minRound=Math.min(...pendingMatches().filter(x=>x.stage==='group').map(x=>x.round));
    sc-=100*(m.round-minRound);why.push('סיבוב '+m.round);
    const maxP=Math.max(...S.groups.map(g=>groupProgress(g.id)));const lag=maxP-groupProgress(m.groupId);
    if(lag>0.01){sc+=30*lag*4;why.push(G(m.groupId).name+' מפגר')}
  }else if(m.stage==='swiss'||m.stage==='round'){
    const pend=pendingMatches().filter(x=>x.stage===m.stage);
    const minRound=pend.length?Math.min(...pend.map(x=>x.round)):m.round;
    sc-=100*(m.round-minRound);why.push('סיבוב '+m.round);
  }else if(m.stage==='king'){why.push('מלך השולחן')}
  else{sc-=100*m.koRound;why.push(isCons(m.bracket)?'נוקאאוט תחתון · '+koRoundName(m):'נוקאאוט'+' · '+koRoundName(m))}
  const pids=matchPids(m);
  const idle=Math.max(...pids.map(id=>now-idleSince(id)));sc+=2*mins(idle);
  const restMs=S.settings.restMin*60000;const lastEnd=Math.max(0,...pids.map(id=>S.lastPlayed[id]||0));
  const owes=m.owes;if(owes){sc+=40;why.push('חייב משחקים')}
  else if(lastEnd&&now-lastEnd<restMs){sc-=60;why.push('במנוחה')}
  if(idle>0)why.push('ממתין '+mins(idle)+' דק׳');
  return {sc,why};
}
function candidatesFor(table){
  const now=Date.now();const busy=busyPids();
  let c=pendingMatches().filter(m=>!matchPids(m).some(id=>busy.has(id)));
  if(table.lock&&S.matches.some(m=>m.stage==='group'&&m.status!=='done'))c=c.filter(m=>m.groupId===table.lock);
  c=c.map(m=>({m,...priority(m,now)}));
  const nonRest=c.filter(x=>!x.why.includes('במנוחה'));if(nonRest.length)c=nonRest;
  c.sort((a,b)=>b.sc-a.sc||(a.m.round||0)-(b.m.round||0));
  return c;
}
function startOn(table,m){table.matchId=m.id;m.table=table.n;m.status='playing';m.startedAt=Date.now();logEv(`${sideName(m,1)} – ${sideName(m,2)} לשולחן ${table.n}`)}
function distribute(){
  if(sys()==='king')return kingFill();
  if(autoOut())return 0;
  let n=0;for(const t of S.tables){if(t.matchId)continue;const c=candidatesFor(t);if(c.length){startOn(t,c[0].m);n++}}
  if(!n)n=maybeNextRound()?distribute():0;
  return n;
}
function maybeNextRound(){
  if(sys()==='swiss'&&!S.koBuilt){if(S.matches.filter(m=>m.stage==='swiss').every(m=>m.status==='done'))return swissNextRound()>0}
  if(isTeamSys()){const ms=S.matches.filter(m=>m.stage==='round');const r=Math.max(0,...ms.map(m=>m.round));
    if(r<S.settings.rounds&&ms.every(m=>m.status==='done'))return americanoRound(r+1)>0}
  return false;
}
function autoDistribute(){if(S.settings.auto){distribute();commit()}}
function distributeClick(){const n=distribute();commit();toast(n?`${n} משחקים נשלחו לשולחנות`:'אין משחק מתאים לשולחן פנוי כרגע')}

function estimateFinish(){
  const sy=sys();const par=Math.max(1,S.tables.length);
  if(S.koBuilt){const left=S.matches.filter(m=>m.stage==='ko'&&m.status!=='done'&&!m.bye).length;
    if(!left)return null;return fmtTime(Date.now()+avgDuration(S.settings.boKO)*Math.ceil(left/par))}
  if(sy==='king')return null;
  if(sy==='swiss'){const perRound=Math.ceil(S.players.length/2);const roundsLeft=S.settings.swissRounds-swissRoundsDone();
    const left=S.matches.filter(m=>m.stage==='swiss'&&m.status!=='done').length+roundsLeft*perRound;
    if(!left)return null;return fmtTime(Date.now()+avgDuration(S.settings.boGroup)*Math.ceil(left/par))}
  if(isTeamSys()){const perRound=Math.min(par,Math.floor(S.players.length/4));const roundsLeft=S.settings.rounds-amRoundsDone();
    const left=S.matches.filter(m=>m.stage==='round'&&m.status!=='done').length+roundsLeft*perRound;
    if(!left)return null;const avg=(S.settings.target/11)*8*60000;return fmtTime(Date.now()+avg*Math.ceil(left/par))}
  const left=S.matches.filter(m=>m.stage==='group'&&m.status!=='done').length;
  if(!left)return null;return fmtTime(Date.now()+avgDuration(S.settings.boGroup)*Math.ceil(left/par));
}
function canFinish(){
  const sy=sys();
  // מלך השולחן נגמר רק בלחיצה על "סיום" (תחרות ישנה בלי הסימון: לפי המסך שנשמר)
  if(sy==='king')return S.kingDone===undefined?S.phase==='final':!!S.kingDone;
  if(isTeamSys())return S.matches.filter(m=>m.stage==='round').length>0&&S.matches.filter(m=>m.stage==='round').every(m=>m.status==='done')&&amRoundsDone()>=S.settings.rounds;
  if(sy==='swiss'&&!S.settings.swissKO)return swissRoundsDone()>=S.settings.swissRounds&&S.matches.filter(m=>m.stage==='swiss').every(m=>m.status==='done');
  return S.koBuilt&&koFinished();
}

function playerStage(pid){
  if((S.out||[]).includes(pid))return {txt:'יצא/ה מהתחרות',fin:true};
  if(sys()!=='groups-ko')return null;
  const ko=S.matches.filter(m=>m.stage==='ko'&&(m.p1===pid||m.p2===pid));
  if(!ko.length)return {txt:'שלב הבתים',fin:false};
  // בעץ התחתון המספרים יחסיים לתחתון; מוסיפים את מספר שחקני העליון כדי להציג מקום אמיתי
  const off=S.groups.reduce((a,g)=>a+Math.min(S.settings.advance,g.pids.length),0);
  const lbl=m=>isCons(m.bracket)?'נוקאאוט תחתון · '+koRoundName(m).replace(/(מקומות |על מקום )(\d+)(?:-(\d+))?/,(_,w,a,b)=>w+(+a+off)+(b?'-'+Math.min(+b+off,S.players.length):'')):'נוקאאוט עליון · '+koRoundName(m);
  const open=ko.find(m=>m.status!=='done');
  if(open)return {txt:lbl(open)+(open.status==='pending'&&!S.koBuilt&&!S.koGo?' (הנוקאאוט עוד לא התחיל)':''),fin:false};
  const last=ko.slice().sort((a,b)=>(a.endedAt||0)-(b.endedAt||0)).pop();
  if(isCons(last.bracket)){const pl=S.settings.consPlace?consPlaceOf(pid):null;return {txt:lbl(last),fin:true,place:pl!=null?off+pl-(S.out||[]).filter(o=>{const q=consPlaceOf(o);return q!=null&&q<pl}).length:null}}
  const r=finalRanking().find(x=>x.p.id===pid);
  return {txt:lbl(last),fin:true,place:r?r.place+(r.shared?'=':''):null};
}

}

// משחק בלי תוצאה אחרי 17 דקות: השולחן מהבהב, התראה בלוח הבקרה, והודעה קטנה פעם אחת לכל משחק (בקשת שולה)
const OVERDUE_MS=17*60000;const overdueSeen=new Set();

function readSets(m){const need=needSets(m);const bo=need*2-1;const sets=[];for(let i=0;i<bo;i++){const a=document.getElementById('a'+i),b=document.getElementById('b'+i);if(!a)break;if(a.value===''&&b.value==='')sets.push(null);else sets.push([+a.value,+b.value])}return sets}
function refreshSets(m){
  const need=needSets(m);const sets=readSets(m);let a=0,b=0,err='';
  sets.forEach((s,i)=>{const ia=document.getElementById('a'+i),ib=document.getElementById('b'+i);
    const decided=a>=need||b>=need;ia.disabled=ib.disabled=decided;
    if(decided){ia.value='';ib.value='';return}
    if(!s){ia.classList.remove('bad');ib.classList.remove('bad');return}
    const ok=validSet(s[0],s[1]);ia.classList.toggle('bad',!ok);ib.classList.toggle('bad',!ok);if(!ok)err='מערכה '+(i+1)+' לא חוקית (11 נק׳, או הפרש 2 אחרי 10:10)';
    if(ok){if(s[0]>s[1])a++;else b++}});
  document.getElementById('swA').textContent=a;document.getElementById('swB').textContent=b;
  const done=(a>=need||b>=need)&&!err;
  const e=document.getElementById('resErr');e.style.display=err?'block':'none';e.textContent=err;
  const btn=document.getElementById('saveRes');btn.disabled=!done;btn.textContent=done?'שמור ופנה שולחן':`צריך עוד ${need-Math.max(a,b)} מערכות`;
}
function quickFill(mid,side){const m=S.matches.find(x=>x.id===mid);const need=needSets(m);for(let i=0;i<need;i++){document.getElementById('a'+i).value=side?0:11;document.getElementById('b'+i).value=side?11:0}refreshSets(m)}
// quiet: סגירה אוטומטית (שחקן שיצא) — בלי הודעה ובלי לדרוס את 'ביטול' של התוצאה שהוזנה באמת
function finishMatch(m,winner,sets,flags,quiet){
  const prev=JSON.parse(JSON.stringify(m));const edit=prev.status==='done';
  m.sets=sets;m.winner=winner;m.status='done';m.endedAt=edit&&prev.endedAt||Date.now();Object.assign(m,flags||{});
  if(m.startedAt&&!m.wo&&!edit){const bo=(m.stage==='group'||m.stage==='swiss')?S.settings.boGroup:S.settings.boKO;const d=S.avgDur[bo]||(S.avgDur[bo]={sum:0,n:0});const dur=m.endedAt-m.startedAt;if(dur>2*60000&&dur<90*60000){d.sum+=dur;d.n++}}
  const prevLP1=S.lastPlayed[m.p1]||null,prevLP2=S.lastPlayed[m.p2]||null;if(!edit){S.lastPlayed[m.p1]=m.endedAt;S.lastPlayed[m.p2]=m.endedAt}
  const t=S.tables.find(x=>x.matchId===m.id);if(t)t.matchId=null;m.table=null;
  logEv(`${pname(m.winner)} ניצח/ה את ${pname(m.winner===m.p1?m.p2:m.p1)} ${setsWon(m).join(':')}${m.wo?' (טכני)':''}`);
  if(m.stage==='ko')advanceKO(m);
  if(!quiet)S.lastUndo={mid:m.id,prev,tableN:t?t.n:null,lastPlayed:{[m.p1]:prevLP1,[m.p2]:prevLP2},ids:S.matches.map(x=>x.id)};
  if(m.stage==='swiss'&&S.matches.filter(x=>x.stage==='swiss').every(x=>x.status==='done'))swissNextRound();
  if(!quiet)closeModal();commit();
  if(!quiet)toast(`${pname(m.winner)} ניצח/ה ${setsWon(m).join(':')}`,{label:'ביטול',fn:undoLast});
  autoDistribute();
}
function saveResult(mid){
  const m=S.matches.find(x=>x.id===mid);const need=needSets(m);
  const sets=readSets(m).filter(Boolean);if(sets.some(s=>!validSet(s[0],s[1])))return;
  let a=0,b=0;for(const [x,y] of sets){if(x>y)a++;else b++}

  const wasDone=m.status==='done';
  if(wasDone&&m.stage==='ko'&&koHasDownstream(m)){if(!confirm('המשחק הזה כבר קידם שחקן בעץ. לשנות בכל זאת? המשחקים הבאים יאופסו.'))return;resetDownstream(m)}
  finishMatch(m,a>need-1?m.p1:m.p2,sets,{wo:false,retired:null});
}
function walkover(mid,absent){const m=S.matches.find(x=>x.id===mid);if(!confirm(`${pname(absent)} לא הגיע/ה — ניצחון טכני ל${pname(absent===m.p1?m.p2:m.p1)}?`))return;if(m.status==='done'&&m.stage==='ko'&&koHasDownstream(m)){if(!confirm('המשחק הזה כבר קידם שחקן בעץ. לשנות בכל זאת? המשחקים הבאים יאופסו.'))return;resetDownstream(m)}const need=needSets(m);const w=absent===m.p1?m.p2:m.p1;const sets=[];for(let i=0;i<need;i++)sets.push(w===m.p1?[11,0]:[0,11]);finishMatch(m,w,sets,{wo:true,retired:null})}
// שחקן שיצא מהתחרות: כל משחק שלו (עכשיו ובהמשך העץ) נסגר כניצחון טכני ליריב
function withdrawPlayer(pid){if(!confirm(`להוציא את ${pname(pid)} מהתחרות? כל המשחקים שנשארו לו/ה ייסגרו כניצחון טכני ליריב.`))return;S.out=[...(S.out||[]),pid];S.kingQueue=(S.kingQueue||[]).filter(x=>x!==pid);if(isTeamSys())amWithdraw(pid);commit();if(!autoOut())autoDistribute();toast(`${pname(pid)} יצא/ה מהתחרות`)}
function autoOut(){const out=S.out||[];if(!out.length)return false;const m=S.matches.find(x=>x.status!=='done'&&x.p1&&x.p2&&(out.includes(x.p1)||out.includes(x.p2)));if(!m)return false;
  const absent=out.includes(m.p1)?m.p1:m.p2;const w=absent===m.p1?m.p2:m.p1;
  // מלך השולחן: היריב מקבל ניצחון ונשאר על השולחן (דרך הלוגיקה של המלך, לא סגירה רגילה שמעלימה אותו)
  if(m.stage==='king'){const tg=m.target||S.settings.kingTarget;finishPoint(m,w===m.p1?[tg,0]:[0,tg],w===m.p1?1:2,true);return true}
  const sets=[];for(let i=0;i<needSets(m);i++)sets.push(w===m.p1?[11,0]:[0,11]);finishMatch(m,w,sets,{wo:true,retired:null},true);return true}
function retire(mid,who){const m=S.matches.find(x=>x.id===mid);const need=needSets(m);const w=who===m.p1?m.p2:m.p1;const sets=[];let a=0,b=0;for(const s of readSets(m).filter(s=>s&&validSet(s[0],s[1]))){const l=s[0]>s[1]?1:2;if((w===m.p1?l===2&&b>=need-1:l===1&&a>=need-1))continue;sets.push(s);if(l===1)a++;else b++}while((w===m.p1?a:b)<need){sets.push(w===m.p1?[11,0]:[0,11]);if(w===m.p1)a++;else b++}finishMatch(m,w,sets,{wo:false,retired:who})}
function backToQueue(mid){const m=S.matches.find(x=>x.id===mid);const t=S.tables.find(x=>x.matchId===mid);if(t)t.matchId=null;
  if(m.stage==='king'){S.kingQueue=[m.p2,...S.kingQueue.filter(x=>x!==m.p2)];S.matches=S.matches.filter(x=>x.id!==mid);closeModal();commit();return}
  m.status='pending';m.table=null;m.startedAt=null;closeModal();commit()}
function undoLast(){
  const u=S.lastUndo;if(!u)return;const m=S.matches.find(x=>x.id===u.mid);
  if(m.stage==='ko')resetDownstream(m);
  if(u.ids){
    const keep=new Set(u.ids);const created=S.matches.filter(x=>!keep.has(x.id));
    if(created.every(x=>x.status!=='done'||x.bye)){created.forEach(x=>{const t=S.tables.find(tt=>tt.matchId===x.id);if(t)t.matchId=null});S.matches=S.matches.filter(x=>keep.has(x.id));
      if(m.stage==='swiss')S.byes=S.matches.filter(x=>x.stage==='swiss'&&x.bye).map(x=>x.p1);
    }
  }
  if(u.king&&u.king.prevKing){S.kingQueue=u.king.prevKing.q;S.kingHolders=u.king.prevKing.h;S.kingCrowns=u.king.prevKing.c}
  Object.assign(m,u.prev);
  if(m.stage==='ko'&&m.status==='done')advanceKO(m);
  if(u.prev.status==='playing'){const t=S.tables.find(x=>x.n===u.tableN);const busy=new Set();S.matches.forEach(x=>{if(x.status==='playing'&&x.id!==m.id)matchPids(x).forEach(id=>busy.add(id))});if(t&&!t.matchId&&!matchPids(m).some(id=>busy.has(id))){t.matchId=m.id}else{m.status='pending';m.table=null;m.startedAt=null}}
  if(u.lastPlayed)Object.assign(S.lastPlayed,u.lastPlayed);
  S.lastUndo=null;hideToast();logEv('בוטלה התוצאה האחרונה','undo');commit();
}

function pRefresh(mid){

function finishPoint(m,score,side,quiet){

function lateEntry(){

    <label class="chip"><input type="radio" name="leg" value="__new" onchange="[...document.querySelectorAll('input[name=leg]')].forEach(x=>x.closest('.chip').classList.toggle('on',x.checked))">בית חדש</label></div>
  <div class="explain" style="margin-top:10px">${options.map(o=>`<div><b>${esc(o.g.name)}:</b> +${o.newMatches} משחקים, כ-${o.estMin} דק׳ נוספות${o.warn.length?` · <span style="color:var(--warn)">${o.warn.join(' · ')}</span>`:' · מומלץ'}</div>`).join('')||'כל הבתים הסתיימו — אפשר רק בית חדש (שחקן אחד לבדו לא יכול לשחק; הוסיפו לפחות 3).'}</div>

/* ========================= SWISS ========================= */
function startSwiss(){
  S.tables.forEach(t=>t.matchId=null);S.matches=[];S.byes=[];S.koBuilt=false;syncTables();S.tables.forEach(t=>t.lock=null);
  S.lastPlayed={};S.phaseStart=Date.now();S.tab='dash';
  if(!S.settings.swissRounds)S.settings.swissRounds=suggestSwissRounds(S.players.length);
  {const mx=swissMaxRounds(S.players.length);if(S.settings.swissRounds>mx){S.settings.swissRounds=mx;toast(`עם ${S.players.length} שחקנים אפשר עד ${mx} סיבובים בלי משחק חוזר, לכן ${mx} סיבובים`)}}
  swissNextRound();logEv(`התחילה תחרות שוויצרית — ${S.settings.swissRounds} סיבובים`,'start');goto('live');if(S.settings.auto)autoDistribute();
}
function swissStandings(){
  const ms=S.matches.filter(m=>m.stage==='swiss');
  const st={};S.players.forEach(p=>st[p.id]=Object.assign({id:p.id,opp:[]},playerStats(p.id,ms)));
  ms.filter(m=>m.status==='done'&&m.p1&&m.p2).forEach(m=>{if(st[m.p1])st[m.p1].opp.push(m.p2);if(st[m.p2])st[m.p2].opp.push(m.p1)});
  Object.values(st).forEach(x=>x.buch=x.opp.reduce((a,o)=>a+(st[o]?st[o].mp:0),0));
  return Object.values(st).sort((a,b)=>b.mp-a.mp||b.buch-a.buch||(b.sw-b.sl)-(a.sw-a.sl)||(b.pw-b.pl)-(a.pw-a.pl)||pname(a.id).localeCompare(pname(b.id)));
}
function swissRoundsDone(){const ms=S.matches.filter(m=>m.stage==='swiss');return ms.length?Math.max(...ms.map(m=>m.round)):0}
function swissNextRound(){
  const done=swissRoundsDone();
  if(done>=S.settings.swissRounds)return 0;
  const played=new Set();S.matches.filter(m=>m.stage==='swiss'&&m.p1&&m.p2).forEach(m=>{played.add(m.p1+'|'+m.p2);played.add(m.p2+'|'+m.p1)});
  let pool = (done===0 ? S.players.slice().sort((a,b)=>(a.seed||9)-(b.seed||9)).map(p=>p.id) : swissStandings().map(x=>x.id)).filter(id=>!(S.out||[]).includes(id));
  let bye=null;
  if(pool.length%2){const nb=id=>(S.byes||[]).filter(x=>x===id).length;bye=pool.reduce((b,id)=>nb(id)<=nb(b)?id:b,pool[pool.length-1]);pool=pool.filter(x=>x!==bye)}
  let pairs;
  if(done===0){pairs=[];const h=pool.length/2;for(let i=0;i<h;i++)pairs.push([pool[i],pool[i+h]])}
  else{
    // הסיבוב הבא: כל השחקנים חוץ מאחד מאלה עם הכי מעט Bye (כשמספר השחקנים אי-זוגי)
    const all=bye?[...pool,bye]:pool,nb=id=>(S.byes||[]).filter(x=>x===id).length+(id===bye?1:0),mb=Math.min(...all.map(nb));
    const nextPools=bye?all.filter(id=>nb(id)===mb).map(x=>all.filter(y=>y!==x)):[pool];
    pairs=swissPair(pool,played,done+1<S.settings.swissRounds?pp=>{const pl=new Set(played);pp.forEach(([x,y])=>{pl.add(x+'|'+y);pl.add(y+'|'+x)});return nextPools.some(np=>!!swissPair(np,pl,null,5000))}:null)||fallbackPair(pool)}
  const rem=pairs.filter(([a,b])=>played.has(a+'|'+b));
  if(rem.length){const t=`שימו לב: בסיבוב ${done+1} יש משחק חוזר (${rem.map(([a,b])=>pname(a)+' – '+pname(b)).join(', ')}). אין זיווג אחר אפשרי.`;logEv(t,'round');setTimeout(()=>toast(t),0)}
  pairs.forEach(([a,b])=>S.matches.push(newMatch({stage:'swiss',round:done+1,p1:a,p2:b})));
  if(bye){S.byes=(S.byes||[]).concat(bye);const m=newMatch({stage:'swiss',round:done+1,p1:bye,p2:null});m.status='done';m.winner=bye;m.bye=true;S.matches.push(m);logEv(pname(bye)+' קיבל/ה בוחן (Bye) בסיבוב '+(done+1))}
  logEv('נוצר סיבוב '+(done+1),'round');
  return pairs.length;
}
// accept: כשיש עוד סיבוב, זיווג מתקבל רק אם גם בסיבוב הבא יש זיווג בלי משחק חוזר (עם 6 שחקנים בלי זה נתקעים ב-15% מהתחרויות)
function swissPair(pool,played,accept,lim){
  let full=0,steps=0,first=null;lim=lim||200000;
  const go=(rest,acc)=>{
    if(!rest.length){full++;if(!first)first=acc.slice();return !accept||full>300||accept(acc)?acc.slice():null}
    if(++steps>lim)return null;
    const a=rest[0];
    for(let i=1;i<rest.length;i++){const b=rest[i];if(played.has(a+'|'+b))continue;acc.push([a,b]);const r=go(rest.filter((x,j)=>j!==0&&j!==i),acc);acc.pop();if(r||steps>lim)return r}
    return null};
  // אף זיווג לא עבר את בדיקת הסיבוב הבא: לוקחים את הראשון שנמצא (עדיין בלי משחק חוזר עכשיו)
  return go(pool,[])||first;
}
function swissMaxRounds(n){return Math.max(1,n-1)}
function fallbackPair(pool){const out=[];for(let i=0;i<pool.length-1;i+=2)out.push([pool[i],pool[i+1]]);return out}
function swissTab(){
  const st=swissStandings();const r=swissRoundsDone();const ms=S.matches.filter(m=>m.stage==='swiss');
  return `${swissStack()}<div class="card"><div class="row" style="justify-content:space-between"><h2>טבלה</h2><span class="tiny">סיבוב ${r} מתוך ${esc(S.settings.swissRounds)}</span></div>
  <div style="overflow-x:auto"><table class="st"><tr><th>#</th><th style="text-align:right">שם</th><th>מש׳</th><th>נצ׳</th><th>הפ׳</th><th>נק׳</th><th>בוכהולץ</th><th>מערכות</th><th>נקודות</th></tr>
  ${st.map((x,i)=>`<tr data-pid="${esc(x.id)}" class="${S.settings.swissKO&&i<S.settings.swissAdvance?'q':''}"><td>${i+1}</td><td class="name">${esc(pname(x.id))}</td><td>${x.played}</td><td>${x.w}</td><td>${x.l}</td><td><b>${x.mp}</b></td><td>${x.buch}</td><td>${x.sw}:${x.sl}</td><td>${esc(x.pw)}:${esc(x.pl)}</td></tr>`).join('')}</table></div>
  <p class="tiny" style="margin-top:8px">בוכהולץ = סכום נקודות המשחק של כל היריבים שלך — שובר השוויון המקובל בשיטה השוויצרית.</p></div>
  <div class="card" style="margin-top:12px"><h2>משחקים</h2>
  ${Array.from({length:r},(_,i)=>i+1).reverse().map(rd=>`<h3 style="margin-top:10px">סיבוב ${rd}</h3><ul class="matchlist">${ms.filter(m=>m.round===rd).map(m=>`<li><span>${esc(pname(m.p1))} ${m.bye?'':'– '+esc(pname(m.p2))}</span><span>${m.bye?'<span class="tiny">בוחן — ניצחון אוטומטי</span>':m.status==='done'?`<span class="sc">${setsWon(m).join(':')}</span> <button class="edit" onclick="openResult('${ja(m.id)}')">ערוך</button>`:m.status==='playing'?`<span class="tiny">שולחן ${esc(m.table)}</span>`:'<span class="tiny">ממתין</span>'}</span></li>`).join('')}</ul>`).join('')}</div>`;
}

/* ========================= AMERICANO / MEXICANO ========================= */
function startAmericano(){
  S.tables.forEach(t=>t.matchId=null);S.matches=[];S.koBuilt=false;syncTables();S.tables.forEach(t=>t.lock=null);
  S.lastPlayed={};S.phaseStart=Date.now();S.tab='dash';
  // שולה: חשוב שכל אחד ישחק בזוג עם כל אחד
  if(sys()==='americano'&&S.settings.rounds<amFullRounds())S.settings.rounds=amFullRounds();
  americanoRound(1);logEv(`התחיל ${SYSTEMS[sys()].n} — ${S.settings.rounds} סיבובים, ${S.settings.target} נק׳ בכל משחק`,'start');goto('live');if(S.settings.auto)autoDistribute();
}
function amStandings(){
  const st={};S.players.forEach(p=>st[p.id]={id:p.id,pts:0,against:0,g:0,w:0});
  S.matches.filter(m=>m.stage==='round'&&m.status==='done').forEach(m=>{
    const [a,b]=m.score||[0,0];
    sideIds(m,1).forEach(id=>{if(!st[id])return;st[id].pts+=a;st[id].against+=b;st[id].g++;if(a>b)st[id].w++});
    sideIds(m,2).forEach(id=>{if(!st[id])return;st[id].pts+=b;st[id].against+=a;st[id].g++;if(b>a)st[id].w++});
  });
  return Object.values(st).sort((x,y)=>y.pts-x.pts||y.w-x.w||(y.pts-y.against)-(x.pts-x.against)||pname(x.id).localeCompare(pname(y.id)));
}
// מי ששיחק הכי מעט משחק; בשוויון — לפי הסדר שקיבלנו
// כמה סיבובים צריך כדי שכל זוג אפשרי ישחק יחד: כל משחק מכסה 2 זוגות
function amFullRounds(){const n=S.players.filter(p=>!(S.out||[]).includes(p.id)).length,c=Math.min(S.settings.tables,Math.floor(n/4));if(!c)return 0;const min=Math.ceil(n*(n-1)/2/(2*c));
  // shortcut: from 7 players the exact minimum is not always reachable (simulation: 96-98%, 46% for 12 on 3 tables); one more round reached 100%
  return min+(n>=7?1:0)}
function amSeat(o,played,need){if(o.length<=need)return o.slice(0,Math.floor(o.length/4)*4);const keep=new Set(o.slice().sort((a,b)=>played[a]-played[b]).slice(0,need));return o.filter(id=>keep.has(id))}
// סיבוב אחד: מי משחק ובאיזה זוגות, עם הכי מעט זוגות חוזרים מתוך tries ניסיונות. מי שנח נבחר בכל ניסיון מחדש
function amRoundPick(ids,played,partnered,opposed,need,tries){
  const pc=p=>(partnered[p[0][0]+'|'+p[0][1]]?100:0)+(partnered[p[1][0]+'|'+p[1][1]]?100:0);let best=null,bestCost=Infinity;
  for(let att=0;att<tries;att++){const o=shuffle(amSeat(shuffle(ids.slice()),played,need));let cost=0;const gs=[];
    for(let i=0;i<o.length;i+=4){const g=o.slice(i,i+4);const opts=[[[g[0],g[1]],[g[2],g[3]]],[[g[0],g[2]],[g[1],g[3]]],[[g[0],g[3]],[g[1],g[2]]]];
      const p=opts.reduce((a,b)=>pc(b)<pc(a)?b:a);cost+=pc(p);gs.push(p);
      for(let x=0;x<4;x++)for(let y=x+1;y<4;y++)cost+=(opposed[g[x]+'|'+g[y]]||0);}
    if(cost<bestCost){bestCost=cost;best=gs;if(cost===0)break}}
  return best}
function amApply(gs,played,partnered,opposed){gs.forEach(([A,B])=>{[A,B].forEach(t=>{partnered[t[0]+'|'+t[1]]=partnered[t[1]+'|'+t[0]]=1});[...A,...B].forEach(x=>played[x]=(played[x]||0)+1);A.forEach(x=>B.forEach(y=>{opposed[x+'|'+y]=(opposed[x+'|'+y]||0)+1;opposed[y+'|'+x]=opposed[x+'|'+y]}))})}
function americanoRound(r){
  const out=S.out||[],act=S.players.filter(p=>!out.includes(p.id));const n=act.length;const courts=Math.min(S.settings.tables,Math.floor(n/4));
  if(courts<1){toast('צריך לפחות 4 שחקנים לשולחן אחד');return 0}
  const played={};S.players.forEach(p=>played[p.id]=0);
  const prev=S.matches.filter(m=>m.stage==='round');
  prev.forEach(m=>matchPids(m).forEach(id=>{if(played[id]!=null)played[id]++}));
  let order = ((sys()==='mexicano'&&r>1) ? amStandings().map(x=>x.id) : shuffle(S.players.map(p=>p.id))).filter(id=>!out.includes(id));
  const need=courts*4;
  const partnered={},opposed={};prev.forEach(m=>{const A=sideIds(m,1),B=sideIds(m,2);[A,B].forEach(t=>{if(t.length===2){partnered[t[0]+'|'+t[1]]=1;partnered[t[1]+'|'+t[0]]=1}});A.forEach(x=>B.forEach(y=>{opposed[x+'|'+y]=(opposed[x+'|'+y]||0)+1;opposed[y+'|'+x]=opposed[x+'|'+y]}))});
  let gs;
  if(!(sys()==='mexicano'&&r>1)){
    // בוחרים את הסיבוב שממנו עדיין אפשר להגיע לכך שכל אחד שיחק בזוג עם כל אחד עד הסיבוב האחרון
    const left=Math.max(0,S.settings.rounds-r),all=order.length*(order.length-1);let bestScore=-1;
    for(let c=0;c<(left?40:1);c++){const cand=amRoundPick(order,played,partnered,opposed,need,300);let score=0;
      for(let k=0;k<(left?4:0);k++){const pl={...played},pt={...partnered},op={...opposed};amApply(cand,pl,pt,op);
        for(let j=0;j<left;j++)amApply(amRoundPick(order,pl,pt,op,need,40),pl,pt,op);
        score=Math.max(score,order.reduce((a,x)=>a+order.filter(y=>pt[x+'|'+y]).length,0));if(score>=all)break}
      if(score>bestScore){bestScore=score;gs=cand}if(score>=all)break}
  } else {order=amSeat(order,played,need);gs=[];for(let i=0;i<order.length;i+=4){const g=order.slice(i,i+4);gs.push([[g[0],g[3]],[g[1],g[2]]])}}
  const playing=gs.flat(2);S.sitOut=act.map(p=>p.id).filter(id=>!playing.includes(id));
  gs.forEach(([t1,t2])=>S.matches.push(newMatch({stage:'round',round:r,t1,t2,target:S.settings.target,score:null})));
  logEv('נוצר סיבוב '+r,'round');
  return 1;
}
// אמריקנו/מקסיקנו: מי שיצא לא נשאר במשחק שלו. מי שנח בסיבוב נכנס במקומו; אם אין מי שנח, המשחק מתבטל והשאר נחים
function amWithdraw(pid){
  for(const m of S.matches.filter(x=>x.stage==='round'&&x.status!=='done'&&matchPids(x).includes(pid))){const sub=(S.sitOut||[]).find(id=>id!==pid&&!(S.out||[]).includes(id));
    if(sub){m.t1=m.t1.map(x=>x===pid?sub:x);m.t2=m.t2.map(x=>x===pid?sub:x);S.sitOut=S.sitOut.filter(x=>x!==sub);logEv(`${pname(sub)} נכנס/ה במקום ${pname(pid)} (${sideName(m,1)} – ${sideName(m,2)})`)}

// עץ מוכן מראש: נבנה כבר בזמן הבתים עם מקומות ריקים ("מקום 1 בית A"), וכל בית שנגמר משבץ את שחקניו לבד

// מתחילים את הנוקאאוט: מעכשיו משחקי העץ שמוכנים עולים לשולחנות
function startKO(){if(!confirm('להתחיל את הנוקאאוט? משחקים שבהם שני השחקנים ידועים יעלו לשולחנות.'))return;S.koGo=true;logEv('הנוקאאוט התחיל','ko');commit();autoDistribute()}

function buildBracket(entrants,bracket){
