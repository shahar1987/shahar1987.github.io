function finalRanking(){
  const sy=sys();
  // אותו סדר ואותם שוברי שוויון כמו בטבלה החיה; "=" רק כשהכול שווה
  const tied=(st,k,f)=>{let place=1;return st.map((x,i)=>{if(i>0&&k(st[i-1])!==k(x))place=i+1;return Object.assign({place,shared:st.filter(y=>k(y)===k(x)).length>1},f(x))})};
  if(isTeamSys())return tied(amStandings(),x=>[x.pts,x.w,x.pts-x.against].join(),x=>({p:P(x.id),extra:x.pts+' נק׳'}));
  if(sy==='king')return tied(kingStandings(),x=>x.w+'/'+x.g,x=>({p:P(x.id),extra:x.w+' ניצחונות'}));
  if(sy==='swiss'&&!S.koBuilt){const st=swissStandings();return st.map((x,i)=>({p:P(x.id),place:i+1,shared:false,extra:x.mp+' נק׳'}))}
  if(sy==='swiss'&&S.koBuilt){
    const st=swissStandings();const main=S.matches.filter(m=>m.stage==='ko'&&m.bracket==='main'&&!m.third);
    const fin=main.find(m=>m.koRound===S.koRounds-1);
    const elim={};main.forEach(m=>{if(m.status!=='done'||m.bye)return;const l=m.winner===m.p1?m.p2:m.p1;if(l)elim[l]=m.koRound});
    const tier=id=>{if(fin&&fin.winner===id)return 0;if(fin&&fin.status==='done'&&(fin.p1===id||fin.p2===id))return 1;if(elim[id]!=null)return 10+(S.koRounds-elim[id]);return 100+st.findIndex(x=>x.id===id)};
    const ord=S.players.slice().sort((a,b)=>tier(a.id)-tier(b.id)||st.findIndex(x=>x.id===a.id)-st.findIndex(x=>x.id===b.id));
    let place=1;return ord.map((p,i)=>{if(i>0&&tier(ord[i-1].id)!==tier(p.id))place=i+1;return {p,place,shared:ord.filter(x=>tier(x.id)===tier(p.id)).length>1&&tier(p.id)>1,extra:''}});
  }
  const res=[];const main=S.matches.filter(m=>m.stage==='ko'&&m.bracket==='main'&&!m.third);
  const eliminatedAt={};for(const m of main){if(m.status!=='done'||m.bye)continue;const l=m.winner===m.p1?m.p2:m.p1;eliminatedAt[l]=m.koRound}
  const finalM=main.find(m=>m.koRound===S.koRounds-1);
  const groupRank={};S.groups.forEach(g=>rankGroup(g.id).order.forEach((id,i)=>groupRank[id]=i));
  const third=S.matches.find(m=>m.stage==='ko'&&m.third&&m.status==='done');
  const players=S.players.slice();
  // מי שיצא מהתחרות תמיד אחרון, גם אם Bye בדירוג התחתון העביר אותו הלאה
  const tier=id=>{if((S.out||[]).includes(id))return 999;if(S.koWinner===id)return 0;if(finalM&&finalM.winner===id)return 0;if(finalM&&finalM.status==='done'&&(finalM.p1===id||finalM.p2===id))return 1;
    if(third){if(third.winner===id)return 2;if(third.p1===id||third.p2===id)return 3}
    if(eliminatedAt[id]!=null)return 10+ (S.koRounds-eliminatedAt[id]);

    if(S.settings.consPlace){const pl=consPlaceOf(id);if(pl!=null)return 50+pl}
    const cons=S.matches.filter(m=>m.stage==='ko'&&m.bracket==='cons');const cf=cons.find(m=>m.koRound===S.consRounds-1);
    if(cf&&cf.winner===id)return 50;if(cf&&cf.status==='done'&&(cf.p1===id||cf.p2===id))return 51;
    const ce={};for(const m of cons){if(m.status!=='done'||m.bye)continue;const l=m.winner===m.p1?m.p2:m.p1;ce[l]=m.koRound}
    if(ce[id]!=null)return 60+(S.consRounds-ce[id]);return 100+(groupRank[id]||0)};
  players.sort((a,b)=>tier(a.id)-tier(b.id)||groupRank[a.id]-groupRank[b.id]);
  let place=1;return players.map((p,i)=>{if(i>0&&tier(players[i-1].id)!==tier(p.id))place=i+1;return {p,place,shared:players.filter(x=>tier(x.id)===tier(p.id)).length>1&&tier(p.id)>1}});
}

function lgLive(){const L=lgL();const us=L.home?0:1;return L.games.map((g,gi)=>{if(!document.querySelector(`input[data-g="${gi}"]`))return g;return {sets:[0,1,2,3,4].map(k=>{const a=document.querySelector(`input[data-g="${gi}"][data-k="${k}"][data-r="0"]`),b=document.querySelector(`input[data-g="${gi}"][data-k="${k}"][data-r="1"]`);if(a.value===''&&b.value==='')return null;const o=[+a.value,+b.value];return us===0?o:[o[1],o[0]]})}})}

  live.forEach((g,gi)=>{const card=document.querySelector(`.lg-game[data-game="${gi}"]`);if(!card)return;const [h,a]=lgSetsWon(g);const w=won[gi];const mine=us===0?[h,a]:[a,h];

let USER=null,PROFILE=null,TID=null,unsubT=null,unsubList=null,LIST=[],cloudT=null,BOOTED=false;
const CLIENT=uid();
window.addEventListener('fb-ready',()=>{
  if(VIEW){FB.onSnapshot(FB.doc(FB.db,'tournamentsPublic',VIEW),snap=>{if(!snap.exists()||!snap.data().state){document.getElementById('app').innerHTML='<div class="card login"><h2>הקישור לא פעיל</h2><p class="muted">התחרות לא פתוחה לצפייה כרגע.</p></div>';return}
      try{S=Object.assign(fresh(),JSON.parse(snap.data().state));render()}catch(e){console.error(e)}},e=>{console.error(e);document.getElementById('app').innerHTML='<div class="card login"><h2>אין גישה</h2></div>'});return}
  FB.onAuthStateChanged(FB.auth,async u=>{const warm=BOOTED&&u&&u.uid===USER.uid;BOOTED=false;USER=u;if(!warm)PROFILE=null;
    try{if(u)localStorage.setItem(KEY+'.uid',u.uid);else localStorage.removeItem(KEY+'.uid')}catch(e){}
    const PK=KEY+'.profile.'+(u&&u.uid);let cached=null;if(u)try{cached=JSON.parse(localStorage.getItem(PK)||'null')}catch(e){}
    // הפרופיל מהמכשיר מאפשר להיכנס מיד; הגרסה מהענן מתעדכנת ברקע (וכללי Firestore אוכפים הרשאות בכל מקרה)
    const fetchP=u?FB.getDoc(FB.doc(FB.db,'users',u.uid)).then(d=>{const p=d.exists()?d.data():null;try{localStorage.setItem(PK,JSON.stringify(p))}catch(e){}return p}).catch(()=>cached):null;
    if(u){if(cached){PROFILE=cached;fetchP.then(p=>{if(USER===u&&JSON.stringify(p)!==JSON.stringify(PROFILE)){PROFILE=p;if(!p){closeTournament(true)}render()}})}else PROFILE=await fetchP}
    // המסך כבר פתוח מהמכשיר: רק מתחברים לענן, בלי לבנות אותו מחדש (שלא יימחק מה שמוקלד עכשיו)
    if(warm&&PROFILE){if(TID)listenT(TID);else{watchList();render()}if(syncState==='pending')scheduleCloud();return}
    if(unsubList){unsubList();unsubList=null}
    closeTournament(true);
    if(u&&PROFILE){if(!unsubList)watchList();
      // רענון או עדכון גרסה: חוזרים לתחרות שהייתה פתוחה במכשיר הזה, לא לרשימה
      let last=null;try{last=localStorage.getItem(KEY+'.last')}catch(e){}if(last){openTournament(last);return}}
    render();});
});
function watchList(){
  if(!window.FB)return;

  unsubList=FB.onSnapshot(q,snap=>{LIST=snap.docs.filter(d=>d.id!=='zz-connection-test').map(d=>({id:d.id,...d.data()}));if(!TID)render()},
    e=>{console.error(e);syncErr=e;setSync('error');if(!TID)render()});

function renderLogin(app){
  app.innerHTML=`<div class="card login stack"><h1>תן לי שולחן</h1><p class="muted">כניסה עם אותו משתמש של אפליקציית הנוכחות.</p>

async function doLogin(){const e=document.getElementById('lg_e').value.trim(),p=document.getElementById('lg_p').value;const err=document.getElementById('lg_err');err.style.display='none';try{await FB.signIn(e,p)}catch(x){err.style.display='block';err.textContent='הכניסה נכשלה — בדקו אימייל וסיסמה.'}}
const PHASE_NAMES={setup:'הגדרות',players:'רישום',draw:'הגרלה',live:'המשחקים רצים',ko:'נוקאאוט',final:'הסתיימה',league:'משחק ליגה'};
// השלב לפי הנתונים (לרשימת התחרויות ולמכשיר שפותח את התחרות בפעם הראשונה), לא לפי המסך שפתוח במכשיר מסוים
function progPhase(){if(sys()==='league')return lgTeamScore().done?'final':'league';if(canFinish())return 'final';if(S.koBuilt)return 'ko';if(S.matches.length)return 'live';if(S.groups.length&&sys()==='groups-ko')return 'draw';return S.players.length?'players':'setup'}
function fmtDate(d){if(!d)return '';const x=new Date(d+'T12:00');if(isNaN(x))return d;const o={weekday:'long',day:'numeric',month:'long'};if(x.getFullYear()!==new Date().getFullYear())o.year='numeric';return x.toLocaleDateString('he-IL',o)}
function tMeta(t){return [fmtDate(t.date),t.system==='league'?'משחק ליגה':`${t.playersCount||0} שחקנים`,PHASE_NAMES[t.phase]||''].filter(Boolean).join(' · ')}
// התחרות שמוצגת בגדול: זו שרצה עכשיו, אחרת הקרובה שעוד לא הסתיימה
function heroTournament(){
  const open=LIST.filter(t=>t.phase!=='final');
  const running=open.find(t=>t.phase==='live'||t.phase==='ko');if(running)return running;
  const today=todayIL();
  const up=open.filter(t=>(t.date||'')>=today).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return up[0]||open[0]||null;
}
function renderList(app){
  const hero=heroTournament();const rest=LIST.filter(t=>t!==hero);
  const running=hero&&(hero.phase==='live'||hero.phase==='ko');
  app.innerHTML=`<h1 style="margin-bottom:16px">התחרויות שלנו</h1>
  ${syncErr?`<div class="err-box" style="margin-bottom:14px"><b>אין גישה לענן.</b> תחרויות שנוצרו במכשיר הזה עדיין עובדות ונשמרות מקומית, אבל לא נראות במכשירים אחרים. <button style="margin-top:8px" onclick="diagnostics()">בדיקה ותיקון</button></div>`:''}
  ${hero?`<div class="hero"><div class="lbl">${running?'התחרות שרצה עכשיו':'התחרות הקרובה'}</div><h2>${esc(hero.name||'ללא שם')}</h2><div class="meta">${esc(tMeta(hero))}</div><button class="primary big" data-tid="${esc(hero.id)}">כניסה לתחרות</button></div>`:''}
  ${rest.length?`${hero?'<div class="list-h">תחרויות נוספות</div>':''}<ul class="tlist">${rest.map(t=>`<li data-tid="${esc(t.id)}"><div><div class="tn">${esc(t.name||'ללא שם')}</div><div class="tm">${esc(tMeta(t))}</div></div><span class="chev">‹</span></li>`).join('')}</ul>`:''}
  ${LIST.length?'':`<div class="card muted" style="margin-bottom:14px">עדיין אין תחרויות. תחרות חדשה לוקחת דקה.</div>`}
  <div class="row" style="margin-top:18px"><button class="${LIST.length?'outline':'primary'} big" style="flex:1 1 200px" onclick="newTournament()">+ תחרות חדשה</button><button class="outline big" style="flex:1 1 200px" onclick="newTournament('league')">+ משחק ליגה</button></div>`;
  // בלי onclick עם מזהה בתוך המחרוזת: המזהה נקרא מ-data-* (dataset), כך ששם או מזהה זדוני לא יכול להריץ קוד.
  app.querySelectorAll('[data-tid]').forEach(el=>el.addEventListener('click',()=>openTournament(el.dataset.tid)));

// מחיקה מותרת בכללי Firestore ל-hasPerm('competitions'): מנהל, או מי שיש לו הרשאת "תחרויות".
function canDelete(){if(!PROFILE)return false;const perms=Array.isArray(PROFILE.permissions)?PROFILE.permissions:[];return String(PROFILE.role||'').toLowerCase()==='admin'||perms.includes('competitions')}
async function newTournament(kind){
  const id=uid()+uid();S=fresh();S.rev=0;TID=id;CLOUD_REV=null;
  if(kind==='league'){S.settings.system='league';S.settings.name='משחק ליגה';S.phase='league';S.league=lgFresh()}

}
async function openTournament(id){
  TID=id;const cached=localStorage.getItem(KEY+'.'+id);if(cached){try{S=Object.assign(fresh(),JSON.parse(cached))}catch(e){}}
  localView=!!cached;lastSig=stSig();try{localStorage.setItem(KEY+'.last',id)}catch(e){}
  CLOUD_REV=null;try{const b=localStorage.getItem(KEY+'.'+id+'.base');if(b!==null&&b!==''&&!isNaN(+b))CLOUD_REV=+b}catch(e){}
  listenT(id);
  render();
}
function listenT(id){
  const ref=FB.doc(FB.db,'tournaments',id);
  if(unsubList){unsubList();unsubList=null}
  if(unsubT)unsubT();
  unsubT=FB.onSnapshot(ref,snap=>{
    // מסמך שחסר רק במטמון (קליטה גרועה, מכשיר חדש) לא אומר שהתחרות נמחקה
    if(!snap.exists()){if(id===PENDING_NEW||(snap.metadata&&snap.metadata.fromCache))return;closeTournament();toast('התחרות נמחקה');return}
    const d=snap.data();if(!d.state)return;const cache=!!(snap.metadata&&snap.metadata.fromCache);
    if(d.client===CLIENT&&(d.rev||0)<=(S.rev||0))return;
    if((d.rev||0)>=(S.rev||0)&&syncState!=='pending'&&syncState!=='saving'){try{applyCloud(id,d.state,Math.max(S.rev||0,d.rev||0),d.rev||0)}catch(e){console.error(e)}}
    else if((d.rev||0)<(S.rev||0)&&!cache){scheduleCloud()}
    if(!cache)setSync('saved');
  },e=>{console.error(e);syncErr=e;setSync('error');
    if(!warnedOnce){warnedOnce=true;toast('אין גישה לענן. עובדים מהמכשיר.',{label:'בדיקה',fn:diagnostics})}});

// שחזור השינויים שהמכשיר הזה עשה בזמן שהענן כבר עודכן ממכשיר אחר. לא דורסים אוטומטית: המשתמש בוחר.

  if(!navigator.onLine){setSync('offline');scheduleRetry();return Promise.resolve(false)}

/* ---------- קישור צפייה פתוח: עותק מקוצר של התחרות, בלי התחברות ---------- */
const VIEW=new URLSearchParams(location.search).get('view');
function viewLink(){return location.origin+location.pathname+'?view='+TID}
// שם פרטי ואות של שם המשפחה, ובלי היומן (שמות מלאים בטקסט חופשי)
// בלי מועדון ובלי מזהה הילד באפליקציית הנוכחות. בזוג ("דני / יוסי") כל אחד מקוצר לחוד; שני שמות שיוצאים זהים מקבלים מספר
function publicState(st){const short=n=>String(n||'').split('/').map(x=>{const w=x.trim().split(/\s+/);return w.length>1?w[0]+' '+w[w.length-1][0]+'.':w[0]||''}).join(' / ');const seen={};
  st.players=(st.players||[]).map(p=>{let n=short(p.name);seen[n]=(seen[n]||0)+1;if(seen[n]>1)n+=' ('+seen[n]+')';return {id:p.id,name:n}});st.log=[];st.lastUndo=null;return st}
// מחיקת העותק הציבורי. מי שאין לו הרשאת מחיקה מרוקן אותו (הקישור מציג "לא פעיל")
function pubOff(tid){if(!tid)return Promise.resolve();const ref=FB.doc(FB.db,'tournamentsPublic',tid);return FB.deleteDoc(ref).catch(()=>FB.setDoc(ref,{name:'',phase:'',state:'',updatedAt:Date.now()})).catch(e=>console.error('public off',e))}
function renderView(app){
  if(sys()==='league'){const L=lgL();app.innerHTML=`<h1>${esc(L.usName)} – ${esc(L.opp)}</h1><div class="tiny" style="margin-bottom:12px">${[L.lg,S.settings.date].filter(Boolean).map(esc).join(' · ')} · מתעדכן אוטומטית</div>`+lgCourts();return}
  const done=canFinish();const r=done?finalRanking():[];
  const pod=done?`<div class="podium"><div class="pod p2"><div class="name">${esc(r[1]?.p.name||'')}</div><div class="block">2</div></div><div class="pod p1"><div class="name">${esc(r[0]?.p.name||'')}</div><div class="block">1</div></div><div class="pod p3"><div class="name">${esc(r[2]?.p.name||'')}</div><div class="block">3</div></div></div>`:'';
  const secs=(done?['table','results']:['now','next','table','results']).map(sc=>`<div class="card" style="margin-bottom:14px">${pubBody(sc)}</div>`).join('');
  const html=`<h1>${esc(S.settings.name)||'תן לי שולחן'}</h1><div class="tiny" style="margin-bottom:12px">${esc(S.settings.date)} · ${done?'התחרות הסתיימה':'מתעדכן אוטומטית'}</div>${pod}${secs}${S.koBuilt?`<div class="card">${bracketTab()}</div>`:''}`;
  app.innerHTML=html.replace(/ onclick="[^"]*"/g,'');
}
let pubTimer=null;
let pubScreen=0;
const PUB_SCREENS=['now','next','table','results'];
function openPublic(){
  pubScreen=0;pubDraw();clearInterval(pubTimer);
  pubTimer=setInterval(()=>{pubScreen=(pubScreen+1)%PUB_SCREENS.length;pubDraw()},sys()==='league'?3000:14000);
  if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
}
function pubDraw(){
  const el=document.getElementById('public');if(!el)return;
  if(sys()==='league'){el.innerHTML=`<div class="public"><h1><span>${esc(S.settings.name)}</span><button class="ghost" style="color:#fff;font-size:16px" onclick="closePublic()">✕ סגור</button></h1>${lgCourts()}</div>`;return}
  const now=Date.now();const busy=busyPids();
  const q=pendingMatches().filter(m=>!matchPids(m).some(id=>busy.has(id))).map(m=>({m,...priority(m,now)}));
  q.forEach(x=>delete x.m._rest);q.sort((a,b)=>b.sc-a.sc);
  const done=canFinish();
  let screens=done?['podium','table','results']:PUB_SCREENS;
  const sc=screens[pubScreen%screens.length];
  const body=pubBody(sc);
  const head=`<h1><span>${esc(S.settings.name)||'תן לי שולחן'}</span><span style="font-size:18px;opacity:.6">${screens.map((x,i)=>i===pubScreen%screens.length?'●':'○').join(' ')}</span><button class="ghost" style="color:#fff;font-size:16px" onclick="closePublic()">✕ סגור</button></h1>`;
  el.innerHTML=`<div class="public">${head}${body}</div>`;
}
function pubBody(sc){
  const now=Date.now();const busy=busyPids();
  const q=pendingMatches().filter(m=>!matchPids(m).some(id=>busy.has(id))).map(m=>({m,...priority(m,now)}));
  q.forEach(x=>delete x.m._rest);q.sort((a,b)=>b.sc-a.sc);
  let body='';
  if(sc==='now'){
    body=`<div class="tables">${S.tables.map(t=>{const m=t.matchId?S.matches.find(x=>x.id===t.matchId):null;
      return m?`<div class="table"><div class="tnum"><span>שולחן ${esc(t.n)}</span><span>${esc(matchLabel(m))}</span></div><div class="players">${esc(sideName(m,1))}<span class="vs">נגד</span>${esc(sideName(m,2))}</div><div class="meta"></div></div>`
      :`<div class="table free"><div class="tnum"><span>שולחן ${esc(t.n)}</span></div><div class="free-lbl">פנוי</div><div class="meta"></div></div>`}).join('')}</div>${sitLine()}`;
  } else if(sc==='next'){
    body=`<div class="next"><h2>להתכונן — הבאים בתור</h2><ul style="padding:0;margin:0">${q.slice(0,8).map(x=>`<li><span>${esc(sideName(x.m,1))} נגד ${esc(sideName(x.m,2))}</span><small>${esc(matchLabel(x.m))}</small></li>`).join('')||'<li>אין משחקים ממתינים</li>'}</ul></div>`;
  } else if(sc==='results'){
    const dn=S.matches.filter(m=>m.status==='done'&&!m.bye).slice(-8).reverse();
    body=`<div class="next"><h2>תוצאות אחרונות</h2><ul style="padding:0;margin:0">${dn.map(m=>m.score&&m.score[0]===m.score[1]?`<li><span>${esc(sideName(m,1))} – ${esc(sideName(m,2))}</span><small>תיקו ${esc(m.score.join(':'))}</small></li>`:`<li><span>${esc(sideName(m,m.winSide||(m.winner===sideIds(m,1)[0]?1:2)))} ניצח/ה</span><small>${esc(m.score?m.score.join(':'):setsWon(m).join(':'))} · ${esc(sideName(m,(m.winSide||(m.winner===sideIds(m,1)[0]?1:2))===1?2:1))}</small></li>`).join('')||'<li>עדיין אין תוצאות</li>'}</ul></div>`;
  } else if(sc==='table'){
    const sy=sys();let rows=[];
    if(sy==='groups-ko'&&!S.koBuilt){rows=S.groups.map(g=>{const r=rankGroup(g.id);return `<div style="margin-bottom:14px"><h2 style="font-size:22px">${esc(g.name)}</h2>${r.order.map((id,i)=>`<div style="font-size:22px;padding:4px 0;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.12)"><span>${i+1}. ${esc(pname(id))}</span><span>${r.stats[id].mp}</span></div>`).join('')}</div>`});
      body=`<div style="columns:${Math.min(3,S.groups.length)};column-gap:30px">${rows.join('')}</div>`;
    } else {
      const st=sy==='swiss'?swissStandings().map(x=>[pname(x.id),x.mp+' נק׳']):isTeamSys()?amStandings().map(x=>[pname(x.id),x.pts+' נק׳']):sy==='king'?kingStandings().map(x=>[pname(x.id),x.w+' נצ׳']):finalRanking().map(x=>[x.p.name,x.extra||'']);
      body=`<div class="next"><h2>טבלה</h2><ul style="padding:0;margin:0">${st.slice(0,12).map((x,i)=>`<li><span>${i+1}. ${esc(x[0])}</span><small>${esc(x[1])}</small></li>`).join('')}</ul></div>`;
    }
  } else if(sc==='podium'){
    const r=finalRanking();
    body=`<div class="podium" style="min-height:300px"><div class="pod p2"><div class="name" style="color:#fff">${esc(r[1]?r[1].p.name:'')}</div><div class="block">2</div></div><div class="pod p1"><div class="name" style="color:#fff">${esc(r[0]?r[0].p.name:'')}</div><div class="block">1</div></div><div class="pod p3"><div class="name" style="color:#fff">${esc(r[2]?r[2].p.name:'')}</div><div class="block">3</div></div></div>`;
  }
  return body;
}
